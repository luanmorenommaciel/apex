--- # The console only. It reads through the Apex API alone (D-api-only).
#
# The default is the Apex API (VITE_DATA_SOURCE=http): the browser carries an
# API token and no database user. Start the API first:
#   (cd ../serve && APEX_API_TOKENS=<token> APEX_API_PORT=8099 uv run apex-api)
#   VITE_APEX_API_TOKEN=<token> docker compose up --build
#
# VITE_DATA_SOURCE=fixtures serves the recorded gate run with no store at all
# (`make up-fixtures`).
services:
  console:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      # Makes the host gateway explicit on Linux; Docker Desktop provides the
      # same name. Override the proxy target when the API is remote or uses
      # another port.
      - "host.docker.internal:host-gateway"
    environment:
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-http}
      # Where the dev server forwards /v1 so the browser stays same-origin;
      # inside the container 127.0.0.1 is the container itself, hence the host
      # gateway alias. The token is passed through from the shell and never
      # written here. VITE_APEX_API_URL is deliberately NOT passed: it makes
      # the browser call the API cross-origin, which the API (no CORS header)
      # refuses.
      VITE_APEX_API_PROXY_TARGET: ${VITE_APEX_API_PROXY_TARGET:-http://host.docker.internal:8099}
      VITE_APEX_API_TOKEN: ${VITE_APEX_API_TOKEN:-}
