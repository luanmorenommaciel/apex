# Apex Console — the production server. Rendered from this template by the
# nginx image's envsubst with ${CLICKHOUSE_UPSTREAM} and ${APEX_API_UPSTREAM}
# as the ONLY substituted variables (NGINX_ENVSUBST_FILTER in the Dockerfile);
# every other $name below is nginx's own.
#
# Text responses are compressed. The bundle is ~340 kB of JavaScript and the
# ClickHouse and API responses are JSON; both shrink to a quarter or less.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # TLS terminates IN FRONT of this image (decided 2026-10-19): a terminator
  # owns the certificate, the https listener and HSTS, and forwards plain http
  # here. Every redirect nginx itself issues - the trailing-slash 301 for a
  # directory, the bare /clickhouse case guarded below - must therefore be a
  # PATH, not an absolute URL: an absolute one would carry http:// as the
  # scheme and port 80, which a browser that arrived over https refuses as
  # mixed content. These two settings make every Location relative.
  absolute_redirect off;
  port_in_redirect off;

  # Hardening headers, on EVERY response. nginx's add_header is not inherited
  # into a location that declares an add_header of its own, so the two
  # locations below that set a Cache-Control repeat this block verbatim —
  # otherwise /config.js, the one response that must not be cached, would be
  # the one without a policy. Keep the three copies identical.
  #
  # The policy keeps the page on its own origin, which both doors already are:
  # /clickhouse and /v1 are proxied here, the fonts are bundled, and the
  # only inline code is the style attributes React sets (Bar, DataTable,
  # SignalStrip, the Finding and Memory charts), hence 'unsafe-inline' on
  # style-src and nowhere else. No HSTS header: this listener
  # is plain http and terminates no TLS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Deployment configuration, rewritten at every container start by
  # docker-entrypoint.d/30-apex-console-config.sh. It MUST NOT be cached: a
  # redeploy that moves the store or changes the data source would otherwise be
  # served the previous deployment's values out of the browser cache, while the
  # hashed bundle beside it updated normally.
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Vite names every asset with a content hash, so a file under /assets/ never
  # changes under its name and the browser may keep it for as long as it likes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # SPA: react-router owns the paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy ClickHouse so the browser stays same-origin in production too.
  # The image entrypoint substitutes this deployment-owned endpoint at startup.
  #
  # BOTH blocks are required. `location /clickhouse/` is a prefix that does not
  # match the bare `/clickhouse`. Measured against this image: nginx answers the
  # bare path with 301 to `http://$host/clickhouse/?…` — the upstream is never
  # reached, the scheme is forced to http and the port is dropped, which behind a
  # TLS terminator a browser refuses as mixed content; and a 301 a browser does
  # follow is replayed as GET, so the SQL body is discarded either way.
  # `/clickhouse/ping` matched all along, so `auto` mode chose the database and
  # only then broke. The client sends the slash (src/data/clickhouse.ts); the
  # exact-match block below is the guard that a change there cannot silently
  # reopen a fault that never reproduces under Vite's dev proxy.
  #
  # Timeouts are explicit on both proxies. connect is short — an upstream that
  # is down should fail in seconds, not hang a screen for a minute; read is the
  # longest a single console query may take. A RUN_LIST over a very large
  # spark_events can approach the read bound: raise proxy_read_timeout here
  # rather than in the client, which has no timeout of its own.
  location = /clickhouse {
    proxy_pass ${CLICKHOUSE_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  location /clickhouse/ {
    proxy_pass ${CLICKHOUSE_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  # The API, forwarded same-origin for the same reason as /clickhouse above:
  # the browser stays on one origin and apex-api needs no CORS header. Only
  # used by DATA_SOURCE=http deployments; a ClickHouse-mode container simply
  # never receives a /v1 request.
  location /v1/ {
    proxy_pass ${APEX_API_UPSTREAM}/v1/;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }
}
