server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Deployment configuration, rewritten at every container start by
  # docker-entrypoint.d/30-apex-console-config.sh. It MUST NOT be cached: a
  # redeploy that moves the store or changes the data source would otherwise be
  # served the previous deployment's values out of the browser cache, while the
  # hashed bundle beside it updated normally.
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # SPA: react-router owns the paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy ClickHouse so the browser stays same-origin in production too.
  # The image entrypoint substitutes this deployment-owned endpoint at startup.
  #
  # BOTH blocks are required. `location /clickhouse/` is a prefix that does not
  # match the bare `/clickhouse`. Measured against this image: nginx answers the
  # bare path with 301 to `http://$host/clickhouse/?…` — the upstream is never
  # reached, the scheme is forced to http and the port is dropped, which behind a
  # TLS terminator a browser refuses as mixed content; and a 301 a browser does
  # follow is replayed as GET, so the SQL body is discarded either way.
  # `/clickhouse/ping` matched all along, so `auto` mode chose the database and
  # only then broke. The client sends the slash (src/data/clickhouse.ts); the
  # exact-match block below is the guard that a change there cannot silently
  # reopen a fault that never reproduces under Vite's dev proxy.
  location = /clickhouse {
    proxy_pass ${CLICKHOUSE_UPSTREAM}/;
    proxy_set_header Host $host;
  }

  location /clickhouse/ {
    proxy_pass ${CLICKHOUSE_UPSTREAM}/;
    proxy_set_header Host $host;
  }
}
