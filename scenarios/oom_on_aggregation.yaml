# Tasks mortas por OutOfMemoryError em agregacao. [G2 / ISSUE-A01]
scenario_id: oom_on_aggregation
version: 1
owner: pod-a1
status: prototype

anti_pattern:
  class: oom_task_failure
  severity: high

code_generator:
  language: pyspark
  emits: job.py
  data:
    orders:    { rows: 200000, distinct_keys: 100, hot_key: null, hot_share: 0.0 }
    customers: { rows: 100, distinct_keys: 100 }
  spark_config:
    spark.sql.shuffle.partitions: "8"
    spark.executor.memory: "512m"

plan_generator:
  emits: event-log.ndjson
  strategy: synthesize
  expected_signals:
    join_operator: SortMergeJoin
    hot_stage: 4
    oom_failed_tasks: 2

oracle:
  enabled: true
  cadence: weekly
  tolerance: { skew_ratio: 0.40, records: 0.30 }
  on_divergence: warn

acceptance:
  expected_detector: oom
  min_severity: critical
  title_includes: ["OutOfMemoryError"]
