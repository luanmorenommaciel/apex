# Produto cartesiano — cross join sem chave. [G2 / ISSUE-A01]
scenario_id: cartesian_product
version: 1
owner: pod-a1
status: prototype

anti_pattern:
  class: cartesian_product
  severity: high

code_generator:
  language: pyspark
  emits: job.py
  data:
    orders:    { rows: 200000, distinct_keys: 100, hot_key: null, hot_share: 0.0 }
    customers: { rows: 100, distinct_keys: 100 }
  spark_config:
    spark.sql.shuffle.partitions: "8"

plan_generator:
  emits: event-log.ndjson
  strategy: synthesize
  expected_signals:
    join_operator: CartesianProduct
    hot_stage: 4

oracle:
  enabled: true
  cadence: weekly
  tolerance: { skew_ratio: 0.40, records: 0.30 }
  on_divergence: warn

acceptance:
  expected_detector: plans
  min_severity: critical
  title_includes: ["CartesianProduct"]
