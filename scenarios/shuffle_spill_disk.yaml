# Shuffle excessivo com spill em disco. [G2 / ISSUE-A01]
scenario_id: shuffle_spill_disk
version: 1
owner: pod-a1
status: prototype

anti_pattern:
  class: shuffle_spill
  severity: high

code_generator:
  language: pyspark
  emits: job.py
  data:
    orders:    { rows: 200000, distinct_keys: 100, hot_key: null, hot_share: 0.0 }
    customers: { rows: 100, distinct_keys: 100 }
  spark_config:
    spark.sql.shuffle.partitions: "8"

plan_generator:
  emits: event-log.ndjson
  strategy: synthesize
  expected_signals:
    join_operator: SortMergeJoin
    hot_stage: 4
    shuffle_bytes_per_task: 52428800      # 50 MiB x 8 = 400 MiB > warning 256 MiB
    disk_spill_bytes_per_task: 8388608    # spill em disco -> critical

oracle:
  enabled: true
  cadence: weekly
  tolerance: { skew_ratio: 0.40, records: 0.30 }
  on_divergence: warn

acceptance:
  expected_detector: shuffle
  min_severity: critical
  title_includes: ["spill em disco"]
