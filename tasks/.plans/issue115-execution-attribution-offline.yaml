api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: issue115-execution-attribution-offline
  source: https://github.com/luanmorenommaciel/apex/issues/115
units:
  - id: T-20260918-execution-stage-attribution-offline
    title: Resolve execution identity to stages offline
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths: []
    creates_paths:
      - engine/src/apex_engine/attribution.py
      - engine/tests/test_execution_attribution.py
    source_note: https://github.com/luanmorenommaciel/apex/issues/115
    why: Contract v0.6 landed the optional producer identity, but Engine has no bounded consumer primitive that distinguishes exact attribution, optional absence, not-found identity, and conflicting stage membership.
    goal: Add a pure two-file Engine resolver from normalized stage observations to an explicit, deterministic attribution result without touching ClickHouse, findings, Serve, Front, schema, watchers, or runtime infrastructure.
    context: This is the ready_offline slice of issue #115 only. It keeps JOB_LEVEL_STAGE_ID unchanged and deliberately does not choose the first public surface. Runtime delivery, store/query integration, per-stage Serve projection and Front availability are separate owner/runtime-gated increments.
    behaviors:
      - id: B-1
        given: observations containing the requested execution identity
        when: they are resolved within an exact app_id and job_id scope
        then: the result is attributed with all and only the distinct stage IDs sorted ascending
      - id: B-2
        given: duplicate deliveries or multiple attempts for one stage
        when: attribution is resolved
        then: stage_attempt remains provenance and the returned stage ID is not duplicated
      - id: B-3
        given: scoped observations whose execution identity is absent on every row
        when: attribution is resolved
        then: the result is execution_id_absent with no stage IDs and no synthesized sentinel
      - id: B-4
        given: scoped observations with non-null identities but not the requested one, or no scoped observations
        when: attribution is resolved
        then: the result is execution_id_not_found with no stage IDs
      - id: B-5
        given: a stage associated with the requested identity and another non-null identity in the same app/job scope
        when: attribution is resolved
        then: the result is conflict, returns no partial attribution, and names the conflicting stage IDs deterministically
      - id: B-6
        given: a target identity of zero or rows from another application sharing the same job_id
        when: attribution is resolved
        then: zero remains a real identity and foreign-app rows cannot bleed into the result
      - id: B-7
        given: invalid blank identities or negative stage/attempt values
        when: an observation or request is created
        then: validation rejects the invalid input before resolution
    evals:
      - id: eval_1
        description: focused attribution states and identity boundaries pass
        command: ( cd engine && uv run --extra dev pytest -q tests/test_execution_attribution.py -p no:warnings )
        verifies: [B-1, B-2, B-3, B-4, B-5, B-6, B-7]
        terminal: true
        expected_duration_sec: 45
      - id: eval_2
        description: complete offline Engine suite remains green
        command: ( cd engine && uv run --extra dev pytest -q -p no:warnings )
        verifies: [B-1, B-3, B-5, B-6]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - Reading ClickHouse or OTLP inside the resolver.
      - Adding execution_id to StageEvent or StageAggregate in this leaf.
      - Changing JOB_LEVEL_STAGE_ID, findings, thresholds, watchers, Serve or Front.
      - Treating zero as absence or synthesizing minus one for a missing execution identity.
      - Returning a partial stage set when a conflicting non-null mapping exists.
      - Publishing, pushing, opening a PR, or running Spark/ClickHouse for this offline leaf.
    do_not_touch:
      - engine/src/apex_engine/schema.py
      - engine/src/apex_engine/clickhouse.py
      - engine/src/apex_engine/watchers
      - serve
      - front
      - jar
      - infra
      - collect
