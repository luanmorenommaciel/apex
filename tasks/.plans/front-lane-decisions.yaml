api_version: taskspec.dev/v1
kind: TaskPlan
approved: false
metadata:
  name: front-lane-decisions
  source: tasks/.plans/front-lane-hardening.yaml (metadata.open_decisions)
  parent_plan: front-lane-hardening
  # NOT approved and NOT batched on purpose. Each leaf below waits on one of
  # the four decisions recorded in front-lane-hardening.yaml. When a decision
  # is taken, record it there under metadata.decisions, rewrite the leaf for
  # the option chosen (each is written for the recommended option and says
  # so), set approved true, and batch THIS file - the other manifest already
  # has materialised units and batch refuses a partial set.
  # A TaskPlan may only depend on units it declares, so the ordering against
  # the hardening leaves is stated in each context, not in depends_on. The
  # depends_on chain below only serialises the files these four share.
  gated_on:
    - id: D-tls-termination
      leaf: T-20261019-nginx-tls-listener
      written_for: option A (optional 443 listener in the image)
    - id: D-auto-fallback-policy
      leaf: T-20261019-auto-never-fixtures
      written_for: option A (auto never resolves to fixtures)
    - id: D-refused-count-home
      leaf: T-20261019-refused-count-server
      written_for: option A (rules 1, 6, 7 as a SQL CTE both doors run)
    - id: D-console-sql-home
      leaf: T-20261019-console-sql-single-source
      written_for: option B (contract/ owns the console statements)
units:
  - id: T-20261019-nginx-tls-listener
    title: Terminate TLS in the image when a certificate is mounted
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths:
      - front/nginx.conf
      - front/Dockerfile
      - front/docker-entrypoint.d/30-apex-console-config.sh
      - front/README.md
    creates_paths: []
    source_note: D-tls-termination in tasks/.plans/front-lane-hardening.yaml; front/nginx.conf listens on 80 only
    why: The image serves the console, the API token in /config.js and every proxied query over plain http. Nothing in the repository terminates TLS and nothing documents who should.
    goal: When TLS_CERT and TLS_KEY name a mounted certificate and key, the image also listens on 443 with that pair, redirects 80 to 443, and sends Strict-Transport-Security on the TLS listener only; with neither set it behaves exactly as today, and the entrypoint refuses a half-configured pair by name. Runs after T-20261019-nginx-hardening, whose header snippet the TLS server block includes.
    context: Written for option A. The entrypoint renders a second server template only when both variables are set, so the plain image is unchanged; HSTS lives in that second block and nowhere else. Proof is a container started with a self-signed pair generated by the eval and curl -k against 443, plus the same nginx -t render as the hardening leaf.
    behaviors:
      - id: B-1
        given: no TLS variables
        when: the image starts
        then: it listens on 80 only and sends no Strict-Transport-Security
      - id: B-2
        given: TLS_CERT and TLS_KEY naming a mounted pair
        when: the image starts
        then: 443 answers with that certificate, 80 redirects to it, and the TLS response carries Strict-Transport-Security
      - id: B-3
        given: only one of the two variables
        when: the image starts
        then: the entrypoint exits with a message naming the missing one
    evals:
      - id: eval_1
        description: the plain image is unchanged
        command: ( cd front && docker rm -f apex-console-tls-eval > /dev/null 2>&1; docker build -q --target prod -t apex-console:tls-eval . > /dev/null && docker run -d --rm --name apex-console-tls-eval -p 18081:80 -e DATA_SOURCE=fixtures apex-console:tls-eval > /dev/null && sleep 2 && H="$(curl -sI http://127.0.0.1:18081/)"; docker rm -f apex-console-tls-eval > /dev/null; echo "$H" | grep -q "200" && ! echo "$H" | grep -qi strict-transport-security )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 120
      - id: eval_2
        description: a mounted self-signed pair enables 443 with HSTS and a redirect from 80
        command: ( cd front && rm -rf .tls-eval && mkdir .tls-eval && openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=localhost -keyout .tls-eval/key.pem -out .tls-eval/cert.pem -days 1 > /dev/null 2>&1 && docker run -d --rm --name apex-console-tls-eval -p 18081:80 -p 18443:443 -e DATA_SOURCE=fixtures -e TLS_CERT=/tls/cert.pem -e TLS_KEY=/tls/key.pem -v "$PWD/.tls-eval:/tls:ro" apex-console:tls-eval > /dev/null && sleep 2 && S="$(curl -skI https://127.0.0.1:18443/)" && R="$(curl -sI http://127.0.0.1:18081/)"; docker rm -f apex-console-tls-eval > /dev/null; rm -rf .tls-eval; echo "$S" | grep -qi strict-transport-security && echo "$R" | grep -q "301" )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 120
      - id: eval_3
        description: a half pair is refused by name
        command: ( cd front && ! docker run --rm -e DATA_SOURCE=fixtures -e TLS_CERT=/tls/cert.pem apex-console:tls-eval true 2> /dev/null && docker run --rm -e DATA_SOURCE=fixtures -e TLS_CERT=/tls/cert.pem apex-console:tls-eval true 2>&1 | grep -q TLS_KEY )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 30
    anti_patterns:
      - Strict-Transport-Security on the plain listener.
      - A certificate or key baked into the image.
      - Making TLS mandatory - the external-terminator deployment must keep working.
    do_not_touch:
      - front/src
      - front/index.html

  - id: T-20261019-auto-never-fixtures
    title: Stop auto from serving the recording as production data
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-nginx-tls-listener]
    touches_paths:
      - front/src/data/repository.ts
      - front/src/data/useRepository.tsx
      - front/src/data/repository.test.ts
      - front/docker-entrypoint.d/30-apex-console-config.sh
      - front/README.md
      - front/.env.example
    creates_paths:
      - front/src/components/molecules/StoreUnreachable.tsx
      - front/src/data/resolveRepository.test.ts
    source_note: D-auto-fallback-policy in tasks/.plans/front-lane-hardening.yaml; front/src/data/repository.ts resolveRepository() (auto falls through to FixtureRepository), front/docker-entrypoint.d/30-apex-console-config.sh (auto with no store is refused at boot, auto with an unreachable store is not)
    why: In auto, when the API and ClickHouse both fail to answer, the console shows the recorded gate run with only a small header badge to say so. A production visitor sees a run that never happened on their cluster.
    goal: auto resolves to the API, then ClickHouse, and otherwise to a named failure screen that lists what was probed and how to pin a source; FixtureRepository is reachable only through DATA_SOURCE=fixtures; the entrypoint's auto message and the docs say so. Runs after T-20261019-query-cache-dedupe-abort, which rewrites useRepository.tsx.
    context: Written for option A. resolveRepository returns a discriminated result - a repository or an unreachable record carrying the probe outcomes - and RepositoryProvider renders StoreUnreachable instead of mounting the app when it is the latter. The dev server keeps the same rule; developers who want the recording set VITE_DATA_SOURCE=fixtures, which make up-fixtures already does.
    behaviors:
      - id: B-1
        given: DATA_SOURCE=auto with both probes failing
        when: the app boots
        then: StoreUnreachable renders, naming /v1/health and /clickhouse/ping, and no FixtureRepository is constructed
      - id: B-2
        given: DATA_SOURCE=fixtures
        when: the app boots
        then: FixtureRepository is used, as before
      - id: B-3
        given: the entrypoint in auto with only the API configured
        when: it writes its warning
        then: the warning no longer promises the recorded run as a fallback
    evals:
      - id: eval_1
        description: the resolution tests pass
        command: ( cd front && npx vitest --run src/data/resolveRepository.test.ts src/data/repository.test.ts )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the entrypoint and docs stop promising the recording
        command: ( cd front && ! grep -q "shows the recorded run" docker-entrypoint.d/30-apex-console-config.sh && ! grep -q "falls back to fixtures" .env.example && grep -q "StoreUnreachable\|unreachable" README.md )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 5
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - A banner over fixture data - that is option B, which was not chosen.
      - Removing FixtureRepository or the fixtures mode.
    do_not_touch:
      - front/src/data/fixtures.ts
      - front/src/screens
      - front/nginx.conf

  - id: T-20261019-refused-count-server
    title: Compute refused_count in the run rollup both doors run
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-auto-never-fixtures]
    touches_paths:
      - front/src/data/queries.ts
      - front/src/data/repository.ts
      - front/src/contract/rules.ts
      - front/src/screens/RunsScreen.tsx
      - front/README.md
      - serve/src/apex_mcp/ch.py
      - serve/tests/test_console_parity_gate.py
      - serve/tests/test_api_resources.py
    creates_paths:
      - front/src/contract/refusedCount.test.ts
    source_note: D-refused-count-home in tasks/.plans/front-lane-hardening.yaml; front/src/data/repository.ts line 126 (refused_count -1), front/src/contract/rules.ts assessStage() (rules 1, 6, 7), serve/src/apex_mcp/ch.py _run_rollup_sql, serve/tools/console_parity_gate.py
    why: refused_count is -1 on every run in the list because it is derived from stage rows the list query does not read, so the runs screen shows a dash where the engine's restraint should be visible. The rule logic exists only in TypeScript.
    goal: RUN_LIST and RUN_ONE carry a refused_count column computed by a CTE over spark_events and job_conf that encodes rules 1, 6 and 7 exactly as assessStage() does, serve's copy of the rollup carries the same CTE, the parity gate proves the two doors agree, and a front test runs assessStage() over the fixtures and asserts the SQL's arithmetic reproduces it for every recorded stage. Runs after T-20261019-query-cache-dedupe-abort and the serve lane's agreement.
    context: Written for option A. This is cross-lane - serve's ch.py and two serve tests change - and the signed scope must say so. The work_bound, cluster_width_unknown and not_a_distribution refusals each become a boolean expression; a stage with no job_conf slots is cluster_width_unknown, which the SQL must count as refused, not as unknown.
    behaviors:
      - id: B-1
        given: the fixtures' stages and conf
        when: assessStage() counts refusals and the SQL expression is evaluated over the same rows
        then: the counts are equal per run
      - id: B-2
        given: RUN_LIST through both doors against the same store
        when: the parity gate runs
        then: refused_count is present and equal
      - id: B-3
        given: the runs screen
        when: it renders
        then: refused_count is a number, never a dash, for an indexed run with stage rows
    evals:
      - id: eval_1
        description: the SQL arithmetic reproduces assessStage over the recording
        command: ( cd front && npx vitest --run src/contract/refusedCount.test.ts )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: serve's rollup carries the same column and its static tests pass
        command: ( cd serve && uv run --extra dev pytest tests/test_console_reads.py tests/test_console_parity_gate.py tests/test_api_resources.py tests/test_ch.py -q -p no:warnings )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 90
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - A Python port of assessStage - the SQL is the single owner both doors run.
      - Counting an unindexed run as zero refusals.
    do_not_touch:
      - engine
      - front/src/data/fixtures.ts

  - id: T-20261019-console-sql-single-source
    title: Move the console statements to the contract directory
    effort: L
    profile: standard
    agent: any
    execution_backend: claude
    depends_on: [T-20261019-refused-count-server]
    touches_paths:
      - front/src/data/queries.ts
      - front/vite.config.ts
      - front/src/data/env.d.ts
      - serve/src/apex_mcp/ch.py
      - serve/pyproject.toml
      - serve/tests/test_console_reads.py
      - serve/tests/test_projection_parity.py
      - serve/tests/test_console_parity_gate.py
      - serve/tools/console_parity_gate.py
      - contract/README.md
      - front/README.md
    creates_paths:
      - contract/console
    source_note: D-console-sql-home in tasks/.plans/front-lane-hardening.yaml; front/src/data/queries.ts, serve/src/apex_mcp/ch.py lines 330-650 (the copies), PIPELINE.md (no lane imports another lane's code)
    why: Every console statement exists twice, once per lane, held together by tests that read one lane's source file from the other. Both copies carry the same ClickHouse workarounds and the same comments, and a change has to be made in both or caught by a text comparison.
    goal: contract/console/*.sql is the single home of each console statement; front imports them as raw text at build and serve reads them from its packaged copy at import; the parity tests become a check that both lanes load the same files; nothing a screen renders changes. Runs after T-20261019-refused-count-server if that one lands first, since it edits the same statements.
    context: Written for option B. The contract directory is already the one shared seam, so the rule in PIPELINE.md holds. serve must package the files (pyproject package-data or a build step) - a running apex-api cannot depend on a sibling checkout. The console's ${...} template reader in the parity gate keeps working because the text is the same, only its path moves.
    behaviors:
      - id: B-1
        given: the built console and the serve package
        when: each loads a statement by name
        then: the text is byte-identical to contract/console/NAME.sql
      - id: B-2
        given: the parity gate against a live store
        when: it runs every statement through both doors
        then: the rows agree, as today
      - id: B-3
        given: queries.ts
        when: it is read
        then: it holds no SQL text, only the imports
    evals:
      - id: eval_1
        description: no SQL text remains in queries.ts and every file is imported
        command: ( cd front && ! grep -q "^SELECT\|^WITH" src/data/queries.ts && test "$(ls ../contract/console/*.sql | wc -l)" -ge 11 && npm run typecheck && npm test -- --run )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 90
      - id: eval_2
        description: serve loads the same files and its tests pass
        command: ( cd serve && uv run --extra dev pytest tests/test_console_reads.py tests/test_projection_parity.py tests/test_console_parity_gate.py tests/test_ch.py -q -p no:warnings )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
      - id: eval_3
        description: the live gate still agrees through both doors
        command: ( cd serve && test -f tools/console_parity_gate.py && echo "run the gate against a disposable ClickHouse per tests/e2e before accepting" )
        verifies: [B-2]
        terminal: false
        expected_duration_sec: 300
    anti_patterns:
      - serve importing from a path outside its package at runtime.
      - Rewriting a statement while moving it.
    do_not_touch:
      - engine
      - memory
      - front/src/screens
