api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: front-lane-decisions
  source: tasks/.plans/front-lane-hardening.yaml (metadata.decisions D-tls-termination, D-auto-fallback-policy, D-refused-count-home, D-console-sql-home)
  parent_plan: front-lane-hardening
  # Approved 2026-10-19 once the user took the four decisions: TLS B, auto A,
  # refused_count A, SQL home A. The SQL-home leaf is gone (A is the status
  # quo); the TLS leaf is rewritten for an external terminator. A second
  # manifest because batch refuses one with materialised units; the ordering
  # against the hardening leaves (all eleven are executed and committed on
  # this branch) is a fact of the branch, not a depends_on. The depends_on
  # chain below serialises the files these three share (README.md).
units:
  - id: T-20261019-tls-external-terminator
    title: Behave correctly behind an external TLS terminator and say so
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths:
      - front/nginx.conf
      - front/README.md
    creates_paths: []
    source_note: D-tls-termination, option B; front/nginx.conf (listen 80, no HSTS, the bare /clickhouse 301 comment names the absolute-http-redirect hazard)
    why: TLS terminates in front of the image, which nothing in the repository says. nginx's own redirects - the trailing-slash 301 try_files issues for a directory, the bare /clickhouse case already guarded - are absolute and carry http as the scheme, so behind a terminator a browser refuses them as mixed content, and nobody has written down that HSTS and the certificate belong to the terminator.
    goal: nginx issues only relative redirects, keeps listening on 80 with no Strict-Transport-Security, and the README has a section that states the terminator contract - TLS, HSTS and the certificate live in front, X-Forwarded-Proto is forwarded, the image never redirects to an absolute http URL - proven on a running container.
    context: absolute_redirect off in the server block turns every nginx-generated Location into a path, so a redirect is scheme-agnostic whichever side of the terminator it crosses; port_in_redirect off beside it keeps the published port out as well. Proof is the real image in fixtures mode on port 18082 answering GET /assets (no trailing slash) with a Location that starts with a slash and no scheme, and eval_1 rendering the template through nginx -t as the hardening leaf did. The README section sits under Configure a deployment after the headers paragraph and says in plain words what the image does NOT do - no 443, no HSTS, no redirect to https - and what the terminator must do.
    behaviors:
      - id: B-1
        given: the real image in fixtures mode
        when: GET /assets without a trailing slash is requested
        then: the 301 Location is a path, not an absolute http URL
      - id: B-2
        given: nginx.conf
        when: it is read
        then: it declares absolute_redirect off, listens on 80 only and names no Strict-Transport-Security
      - id: B-3
        given: the README
        when: it is read
        then: a section names the external terminator, X-Forwarded-Proto and where HSTS is set
    evals:
      - id: eval_1
        description: the real image renders the template and accepts it
        command: ( cd front && docker run --rm -e CLICKHOUSE_UPSTREAM=http://127.0.0.1:1 -e APEX_API_UPSTREAM=http://127.0.0.1:1 -e 'NGINX_ENVSUBST_FILTER=^(CLICKHOUSE_UPSTREAM|APEX_API_UPSTREAM)$' -v "$PWD/nginx.conf:/etc/nginx/templates/default.conf.template:ro" nginx:1.27-alpine nginx -t )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: a live container redirects with a relative Location
        command: ( cd front && docker rm -f apex-console-tls-eval > /dev/null 2>&1; docker build -q --target prod -t apex-console:tls-eval . > /dev/null && docker run -d --rm --name apex-console-tls-eval -p 18082:80 -e DATA_SOURCE=fixtures apex-console:tls-eval > /dev/null && sleep 2 && R="$(curl -sI http://127.0.0.1:18082/assets)"; docker rm -f apex-console-tls-eval > /dev/null; echo "$R" | grep -q "301" && echo "$R" | grep -qi "^location. /assets/" && ! echo "$R" | grep -qi "^location. http" )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 180
      - id: eval_3
        description: the config and the docs say what the image does and does not do
        command: ( cd front && grep -q "absolute_redirect off" nginx.conf && grep -q "port_in_redirect off" nginx.conf && test "$(grep -c '^  listen ' nginx.conf)" = 1 && ! grep -q "Strict-Transport-Security" nginx.conf && grep -q "X-Forwarded-Proto" README.md && grep -qi "terminator" README.md )
        verifies: [B-2, B-3]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - A 443 listener or a certificate path in the image; option A was not chosen.
      - Strict-Transport-Security from the plain listener.
      - A redirect from http to https inside the image; that is the terminator's.
    do_not_touch:
      - front/Dockerfile
      - front/docker-entrypoint.d
      - front/src

  - id: T-20261019-auto-never-fixtures
    title: Stop auto from serving the recording as production data
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-tls-external-terminator]
    touches_paths:
      - front/src/data/repository.ts
      - front/src/data/useRepository.tsx
      - front/src/data/httpRepository.test.ts
      - front/src/data/entrypoint.test.ts
      - front/src/components/molecules/index.ts
      - front/docker-entrypoint.d/30-apex-console-config.sh
      - front/README.md
      - front/.env.example
    creates_paths:
      - front/src/components/molecules/StoreUnreachable.tsx
      - front/src/data/resolveRepository.test.ts
    source_note: D-auto-fallback-policy, option A; front/src/data/repository.ts resolveRepository() (auto falls through to FixtureRepository), front/docker-entrypoint.d/30-apex-console-config.sh (auto with no store is refused at boot, auto with an unreachable store is not), front/src/data/httpRepository.test.ts (the selection tests)
    why: In auto, when the API and ClickHouse both fail to answer, the console shows the recorded gate run with only a small header badge to say so. A production visitor sees a run that never happened on their cluster.
    goal: auto resolves to the API, then ClickHouse, and otherwise to a named failure screen that lists what was probed and how to pin a source; FixtureRepository is reachable only through DATA_SOURCE=fixtures; the entrypoint's auto message and the docs say so.
    context: resolveRepository returns a discriminated result - a Repository, or an unreachable record carrying the two probe outcomes - and RepositoryProvider renders StoreUnreachable instead of mounting the app when it is the latter. StoreUnreachable is a molecule exported from the index like QueryFailure, names /v1/health and /clickhouse/ping as what was asked, and says to set DATA_SOURCE to http, clickhouse or fixtures deliberately. httpRepository.test.ts has the selection tests for resolveRepository and its "falls back to fixtures" case changes meaning; the new resolveRepository.test.ts covers the unreachable branch and that fixtures still resolves on DATA_SOURCE=fixtures. The dev server keeps the same rule; developers who want the recording set VITE_DATA_SOURCE=fixtures, which make up-fixtures does. The entrypoint's auto-with-API-only warning stops promising the recorded run. The screen component tests mock useRepository and are untouched.
    behaviors:
      - id: B-1
        given: DATA_SOURCE=auto with both probes failing
        when: the app boots
        then: StoreUnreachable renders, naming /v1/health and /clickhouse/ping, and no FixtureRepository is constructed
      - id: B-2
        given: DATA_SOURCE=fixtures
        when: the app boots
        then: FixtureRepository is used, as before
      - id: B-3
        given: the entrypoint in auto with only the API configured
        when: it writes its warning
        then: the warning no longer promises the recorded run as a fallback
    evals:
      - id: eval_1
        description: the resolution tests pass
        command: ( cd front && npx vitest --run src/data/resolveRepository.test.ts src/data/httpRepository.test.ts )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the entrypoint and docs stop promising the recording
        command: ( cd front && ! grep -q "shows the recorded run" docker-entrypoint.d/30-apex-console-config.sh && ! grep -q "falls back to fixtures" .env.example && ! grep -q "falls back to the recorded" README.md && grep -qi "no store answered" README.md )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 5
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run && npm run build )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - A banner over fixture data; that is option B, which was not chosen.
      - Removing FixtureRepository or the fixtures mode.
      - Catching a 401 from the API as "unreachable"; apiPing() already counts it as an API that exists.
    do_not_touch:
      - front/src/data/fixtures.ts
      - front/src/screens
      - front/nginx.conf

  - id: T-20261019-refused-count-server
    title: Compute refused_count in the run rollup both doors run
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-auto-never-fixtures]
    touches_paths:
      - front/src/data/queries.ts
      - front/src/data/repository.ts
      - front/src/contract/rules.ts
      - front/src/screens/RunsScreen.tsx
      - front/README.md
      - serve/src/apex_mcp/ch.py
      - serve/tests/test_console_parity_gate.py
      - serve/tests/test_api_resources.py
      - serve/tests/test_ch.py
    creates_paths:
      - front/src/contract/refusedCount.test.ts
    source_note: D-refused-count-home, option A; front/src/data/repository.ts (refused_count -1), front/src/contract/rules.ts assessStage() (rules 1, 6, 7), front/src/data/queries.ts runRollup, serve/src/apex_mcp/ch.py _run_rollup_sql, serve/tools/console_parity_gate.py
    why: refused_count is -1 on every run in the list because it is derived from stage rows the list query does not read, so the runs screen shows a dash where the engine's restraint should be visible. The rule logic exists only in TypeScript.
    goal: RUN_LIST and RUN_ONE carry a refused_count column computed by a CTE over spark_events and job_conf that encodes rules 1, 6 and 7 exactly as assessStage() does, serve's copy of the rollup carries the same CTE, the parity gate proves the two doors agree, and a front test runs assessStage() over the fixtures and asserts the SQL's arithmetic reproduces it for every recorded stage.
    context: This is cross-lane - serve's ch.py and its tests change - and the commit says so. refused_count is the count of stages among the TAIL_SAMPLE loudest p99/p50 ratios that assessStage() reports as not reportable, the number RunDetail already shows as "N of the N loudest refused"; the CTE ranks the latest attempt of each stage by ratio, takes the top five, and counts those whose refusal is work_bound, cluster_width_unknown or not_a_distribution with the same arithmetic rules.ts uses - volume floor, slots from job_conf, (n-1)/(s-1) bar - so a stage with no job_conf slots counts as cluster_width_unknown, refused, not unknown. The sentinel stays -1 for a run with no stage rows. The refusedCount test evaluates the same arithmetic in TypeScript over fx.stagesByJob and fx.jobConfByJob and compares with assessStage(); the live parity gate is the proof the SQL itself agrees, run per the disposable-ClickHouse recipe before accepting.
    behaviors:
      - id: B-1
        given: the fixtures' stages and conf
        when: assessStage() counts refusals among the five loudest and the CTE's arithmetic is evaluated over the same rows
        then: the counts are equal per run
      - id: B-2
        given: RUN_LIST and RUN_ONE in front and serve
        when: serve's static tests and the parity gate's statement reader run
        then: refused_count is present in both rollups and the texts agree
      - id: B-3
        given: the runs screen
        when: it renders a run with stage rows
        then: refused_count is a number, never a dash
    evals:
      - id: eval_1
        description: the SQL arithmetic reproduces assessStage over the recording
        command: ( cd front && npx vitest --run src/contract/refusedCount.test.ts )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: serve's rollup carries the same column and its static tests pass
        command: ( cd serve && uv run --extra dev pytest tests/test_console_reads.py tests/test_console_parity_gate.py tests/test_api_resources.py tests/test_ch.py tests/test_projection_parity.py -q -p no:warnings )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 90
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run && npm run build )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - A Python port of assessStage; the SQL is the single owner both doors run.
      - Counting an unindexed run or a run with no stage rows as zero refusals.
      - Editing the refusal thresholds in rules.ts to make the SQL match.
    do_not_touch:
      - engine
      - front/src/data/fixtures.ts
