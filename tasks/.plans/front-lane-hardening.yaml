  - id: T-20261019-a11y-baseline
    title: Lint for accessibility and give every control a name
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-screen-component-tests, T-20261019-self-hosted-fonts]
    touches_paths:
      - front/package.json
      - front/package-lock.json
      - front/eslint.config.js
      - front/src/screens
      - front/src/components
    creates_paths:
      - front/src/screens/a11y.test.tsx
    source_note: one aria-label in front/src (VerifyScreen.tsx line 421), no label or htmlFor anywhere, no jsx-a11y in eslint.config.js, RunsScreen.tsx lines 72 and 83 (status by colour class and StatusPill), Pill.tsx tones
    why: The console has one aria-label, no form label, status conveyed by colour alone in the runs list, and no lint rule that would notice the next one. A screen reader hears an unlabeled textbox and a list of coloured dots.
    goal: eslint-plugin-jsx-a11y runs at error level in the lint gate and passes, every input and select in the screens has an accessible name, every status or severity that is a colour also reads as text, the nav and header are landmarks with names, and a test asserts the first two of those against the real screens.
    context: Add eslint-plugin-jsx-a11y and its flat recommended config to eslint.config.js for src files at error level, run the lint, and fix what it reports - the errors are the work list. Then the things lint cannot see - the search input and filter in RunsScreen get a visible label or aria-label, the nav in NavBar gets aria-label Primary, the source and contract badges get a title, and StatusPill and the severity pills must contain the word, not only the tone (Pill already renders children; check each call site passes text and not an empty glyph). The a11y test mounts RunsScreen, CompareScreen and MemoryScreen against FixtureRepository and asserts every input and select has aria-label, aria-labelledby or an associated label element, and that each run row's status cell textContent contains healthy, warning or degraded. The screen tests from the previous leaf must still pass unchanged - they assert on text, not markup.
    behaviors:
      - id: B-1
        given: eslint.config.js with jsx-a11y recommended at error level
        when: npm run lint runs
        then: it passes with zero warnings
      - id: B-2
        given: RunsScreen, CompareScreen and MemoryScreen mounted
        when: their inputs and selects are enumerated
        then: each has an accessible name
      - id: B-3
        given: the runs list rows
        when: the status cell text is read
        then: it contains the status word, not only a colour
      - id: B-4
        given: the NavBar
        when: its nav element is read
        then: it carries aria-label
    evals:
      - id: eval_1
        description: the a11y plugin is wired at error level and lint passes
        command: ( cd front && grep -q "jsx-a11y" eslint.config.js && grep -q "eslint-plugin-jsx-a11y" package.json && npm run lint )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60
      - id: eval_2
        description: the a11y test and the screen tests pass
        command: ( cd front && npx vitest --run src/screens/a11y.test.tsx src/screens src/components )
        verifies: [B-2, B-3, B-4]
        terminal: true
        expected_duration_sec: 60
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm test -- --run && npm run build )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - Disabling a jsx-a11y rule to make lint pass instead of fixing the markup.
      - aria-hidden on content a sighted user reads.
      - Replacing a colour token with text - the text goes beside the colour, the palette is the ratified identity.
    do_not_touch:
      - front/tailwind.config.js
      - front/src/data
      - front/src/contract

  - id: T-20261019-query-cache-dedupe-abort
    title: Dedupe, cache and abort the console's reads
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-screen-component-tests]
    touches_paths:
      - front/src/data/useRepository.tsx
      - front/src/data/repository.ts
      - front/src/data/http.ts
      - front/src/screens/RunDetailScreen.tsx
      - front/src/screens/FindingScreen.tsx
      - front/src/screens/CompareScreen.tsx
      - front/src/screens/MemoryScreen.tsx
      - front/src/screens/RunsScreen.tsx
    creates_paths:
      - front/src/data/useAsync.test.tsx
    source_note: front/src/data/useRepository.tsx useAsync (no cache, no dedupe, no AbortSignal), RunDetailScreen.tsx 8 useAsync calls, CompareScreen.tsx 8, FindingScreen.tsx 6, clickhouse.ts query() accepts a signal nobody passes, http.ts apiGet() accepts none
    why: useAsync starts a fetch per call site per mount and never cancels. RunDetail issues eight reads on every visit and Compare eight more; opening a finding from a run refetches the four reads the run just made; under React StrictMode every one of them runs twice; and a response that lands after navigation is only dropped by a boolean, the request itself runs to completion against ClickHouse or the API.
    goal: Concurrent callers of the same read share one request, a read repeated within a short window is served from memory, an unmounted or superseded read is aborted at the fetch, and a test counts repository calls to prove each, including that a StrictMode mount of RunDetail issues each read once.
    context: Replace the body of useAsync with a small keyed cache owned by the repository instance - a Map from key to entry holding the promise, the settled value, its timestamp and an AbortController - where the key is the method name plus its JSON-encoded arguments; callers pass the key explicitly or useAsync derives it from a method-and-args form so RunDetail and Finding share entries. In flight means one promise, settled within the TTL means the value, otherwise a new request. Proposed TTL, open for review - 30 seconds; the console is read-only and new runs arrive on the order of minutes. Every Repository method gains an optional trailing signal parameter, forwarded to clickhouse.ts query() and to a new signal parameter on http.ts apiGet() and fetch; FixtureRepository ignores it. On unmount or deps change the hook aborts the controller only when no other subscriber holds the entry. The serve parity test reads Repository method names with a regex that stops at the opening parenthesis, so the extra parameter does not break it. The test file wraps FixtureRepository in a counting Proxy, mounts RunDetailScreen under StrictMode through the memory router, and asserts each method was called once; mounts two components with the same key and asserts one call; and stubs a fetch that observes its signal to assert abort on unmount for ClickHouseRepository and HttpRepository.
    behaviors:
      - id: B-1
        given: two components mounting the same read at the same time
        when: both resolve
        then: the repository method ran once
      - id: B-2
        given: a component unmounted before its read settles
        when: the fetch's signal is inspected
        then: it is aborted, and no state update follows
      - id: B-3
        given: RunDetailScreen mounted under StrictMode against a counting repository
        when: it settles
        then: run, stages, jobConf, findings and transitions were each called once
      - id: B-4
        given: a read settled within the TTL
        when: another screen asks for the same key
        then: the value is served without a repository call
    evals:
      - id: eval_1
        description: the cache, dedupe and abort tests pass
        command: ( cd front && npx vitest --run src/data/useAsync.test.tsx )
        verifies: [B-1, B-2, B-3, B-4]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the screen tests from the regression net still pass and the API client forwards a signal
        command: ( cd front && npx vitest --run src/screens src/data && grep -q "signal" src/data/http.ts )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 60
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run && npm run build )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
      - id: eval_4
        description: serve still finds every Repository method by name
        command: ( cd serve && uv run --extra dev pytest tests/test_api_resources.py -q -p no:warnings -k repository_method )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Adding a data-fetching library - the hook's deps list stays honest and the dependency set stays three packages.
      - A module-level cache that survives a repository swap - the cache belongs to the instance.
      - Caching a rejected read; an error is retried on the next mount.
      - Removing a Repository method or renaming one - serve pins the names.
    do_not_touch:
      - serve
      - front/src/data/queries.ts
      - front/src/data/fixtures.ts
      - front/src/contract

  - id: T-20261019-browser-door-additive-columns
    title: Let the browser door read a findings table without confidence_score
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20261019-queries-dead-statement, T-20261019-fixtures-lazy-chunk]
    touches_paths:
      - front/src/data/queries.ts
      - front/src/data/repository.ts
    creates_paths:
      - front/src/data/findingsProjection.test.ts
    source_note: front/src/data/queries.ts FINDINGS (projects and orders by confidence_score unconditionally), serve/src/apex_mcp/ch.py lines 80-96 and 552-566 (_FINDINGS_ADDITIVE, system.columns probe, toFloat64(0) fallback), front/contract/01-readonly-user.sql (SELECT and SHOW TABLES on apex.*)
    why: confidence_score is a v0.2 additive column of apex.findings. The API probes system.columns and projects toFloat64(0) when a cluster predates it; the browser door sends FINDINGS as written and the query fails with an unknown-identifier error, so the same deployment works through one door and breaks through the other.
    goal: ClickHouseRepository probes the findings columns once per instance and sends the full FINDINGS when confidence_score exists, or a second exported statement that projects toFloat64(0) AS confidence_score and keeps the same output columns and order when it does not; the probe falling over leaves the full statement in place so the real error still surfaces.
    context: queries.ts gains export const FINDINGS_COLUMNS (SELECT name FROM system.columns WHERE database = currentDatabase() AND table = 'findings') and export const FINDINGS_WITHOUT_SCORE, which is FINDINGS with the column replaced by toFloat64(0) AS confidence_score and the ORDER BY kept, so the row shape the console renders is identical to the API's fallback. FINDINGS itself is not edited - serve/tests/test_console_reads.py reads its text. The two new exports must be consumed from repository.ts, or the consumer test from T-20261019-queries-dead-statement fails if that leaf has landed. apex_ro sees its own tables in system.columns because any privilege on a table implies SHOW on it. ClickHouseRepository caches the probe result in a private promise, like ReadStore.findings_columns() does in ch.py. The test stubs fetch, like httpRepository.test.ts does, answering the probe with and without the column and asserting which statement the next findings() call sends; a third case rejects the probe and asserts FINDINGS is sent and the findings error is the one reported.
    behaviors:
      - id: B-1
        given: a store whose findings table has confidence_score
        when: findings() is called
        then: FINDINGS is sent, after one probe per repository instance
      - id: B-2
        given: a store whose findings table lacks it
        when: findings() is called
        then: FINDINGS_WITHOUT_SCORE is sent and rows carry confidence_score 0
      - id: B-3
        given: a probe that fails
        when: findings() is called
        then: FINDINGS is sent and its own error, not the probe's, is what the caller sees
      - id: B-4
        given: serve's static parity tests
        when: they run
        then: FINDINGS is unchanged and still found
    evals:
      - id: eval_1
        description: the projection tests pass
        command: ( cd front && npx vitest --run src/data/findingsProjection.test.ts )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: serve still reads FINDINGS as written
        command: ( cd serve && uv run --extra dev pytest tests/test_console_reads.py tests/test_projection_parity.py tests/test_console_parity_gate.py -q -p no:warnings )
        verifies: [B-4]
        terminal: true
        expected_duration_sec: 60
      - id: eval_3
        description: the whole front gate stays green
        command: ( cd front && npm run typecheck && npm run lint && npm test -- --run )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 90
    anti_patterns:
      - Editing the text of FINDINGS - serve pins it.
      - Catching the findings error when the probe fails; the fallback is the statement, not silence.
      - Probing on every call.
    do_not_touch:
      - serve
      - front/src/screens
      - front/src/contract
