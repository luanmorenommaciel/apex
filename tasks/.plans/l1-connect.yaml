api_version: taskspec.dev/v1
kind: TaskPlan
approved: true
metadata:
  name: l1-connect
  source: docs/lanes/L1_tasks.md
units:
  # ---------------- A — apex_status() ----------------
  - id: T-20260817-serverstatus-model
    title: Add the ServerStatus Pydantic model
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths: [serve/src/apex_mcp/models.py]
    creates_paths: [serve/tests/test_status.py]
    source_note: docs/lanes/L1_tasks.md
    why: FastMCP derives each tool's output schema from its return annotation; a status tool returning a bare dict would be the one hole in that mitigation.
    goal: Define the typed payload apex_status() returns, before anything produces one.
    context: models.py already holds Diagnosis, RunComparison, KbHits and FixSuggestion and has no intra-package runtime import. Keep it that way.
    behaviors:
      - id: B-1
        given: no arguments but connected=False
        when: a ServerStatus is constructed
        then: it validates with every remaining field taking a default
      - id: B-2
        given: the class
        when: model_json_schema() is called
        then: it renders with connected required and boolean
      - id: B-3
        given: any ServerStatus
        when: it is serialized
        then: no field can carry a credential - no user, password, dsn or connection URL
    evals:
      - id: eval_1
        description: the status model test file passes
        command: ( cd serve && uv run --extra dev pytest tests/test_status.py -q )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the model exposes the contracted field set
        command: ( cd serve && uv run python -c "from apex_mcp.models import ServerStatus; k=set(ServerStatus(connected=False).model_dump()); need={'connected','database','run_count','latest_ingest_age_seconds','contract_tables','using_defaults','degraded_reason','remediation','tools'}; assert need <= k, need - k" )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 15
      - id: eval_3
        description: no credential-shaped field exists on the model
        command: ( cd serve && ! grep -nE '^\s+(password|dsn|secret)\s*:' src/apex_mcp/models.py )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Returning dict[str, Any] instead of a model.
      - Adding a dsn or password field for debugging.
      - Importing ch or diagnose into models.py.
    do_not_touch:
      - serve/src/apex_mcp/server.py
      - serve/src/apex_mcp/ch.py
      - serve/src/apex_mcp/diagnose.py

  - id: T-20260817-store-health-query
    title: Add ReadStore.store_health for counts and freshness
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths: [serve/src/apex_mcp/ch.py, serve/tests/test_ch.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: A connected-but-empty Apex is currently indistinguishable from a broken one.
    goal: One read that answers whether there is data and how fresh it is.
    context: ReadStore at ch.py:197 exposes only job_id-keyed reads. Route the new read through _query() so sanitization is inherited.
    behaviors:
      - id: B-1
        given: a store holding runs
        when: store_health() is called
        then: it returns total row count, distinct job_id count and max(ts) from apex.spark_events
      - id: B-2
        given: an empty but reachable apex.spark_events
        when: store_health() is called
        then: it returns zeros and a null timestamp without raising
      - id: B-3
        given: an unreachable store
        when: store_health() is called
        then: it raises ApexStoreError with the existing sanitized code
    evals:
      - id: eval_1
        description: the ClickHouse layer suite passes including the empty-table case
        command: ( cd serve && uv run --extra dev pytest tests/test_ch.py -q )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: no SQL literal in ch.py contains interpolation
        command: ( cd serve && uv run python -c "import re,pathlib; src=pathlib.Path('src/apex_mcp/ch.py').read_text(); sql=re.findall(r'\"\"\"\s*\n?\s*SELECT.*?\"\"\"', src, re.S); bad=[s for s in sql if '{' in s]; assert not bad, bad; print(len(sql),'SQL constants clean')" )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 10
    anti_patterns:
      - Building the SQL with an f-string.
      - Bypassing _query() and losing _sanitize().
      - SELECT star, or any scan not bounded to apex.spark_events.
    do_not_touch:
      - serve/src/apex_mcp/models.py
      - serve/src/apex_mcp/server.py
      - serve/src/apex_mcp/diagnose.py

  - id: T-20260817-table-columns-probe
    title: Generalize findings_columns into an allowlisted table_columns probe
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-store-health-query]
    touches_paths: [serve/src/apex_mcp/ch.py, serve/tests/test_ch.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: The schema probe is why serve degraded gracefully while the engine write path was dead; it currently covers one table of three.
    goal: Let the status tool report contract conformance for spark_events, findings and plan_transitions.
    context: findings_columns() at ch.py:214 probes system.columns for one hardcoded table. Preserve it as a thin caller.
    behaviors:
      - id: B-1
        given: table_columns("spark_events")
        when: the table exists
        then: it returns that table's column names as a set
      - id: B-2
        given: findings_columns()
        when: called
        then: it returns exactly what it returns today with caching unchanged
      - id: B-3
        given: a table name outside the allowlist
        when: table_columns is called
        then: it raises ApexStoreError before issuing any query
    evals:
      - id: eval_1
        description: the ClickHouse layer suite passes with the new probe tests
        command: ( cd serve && uv run --extra dev pytest tests/test_ch.py -q )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the pre-existing additive-column test was not rewritten to pass
        command: ( cd serve && test -z "$(git diff HEAD -- tests/test_ch.py | grep '^-' | grep -v '^---')" )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 10
    anti_patterns:
      - Interpolating the table name into SQL instead of binding it behind the allowlist.
      - Dropping the memoization the current probe relies on.
      - Widening the allowlist to any table in the apex database.
    do_not_touch:
      - serve/src/apex_mcp/models.py
      - serve/src/apex_mcp/server.py

  - id: T-20260817-status-assembler
    title: Add the pure diagnose.status assembler
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-serverstatus-model]
    touches_paths: [serve/src/apex_mcp/diagnose.py, serve/tests/test_status.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: Every other diagnosis in this lane is a pure function handed its I/O; status must follow or it becomes the one piece needing ClickHouse to test.
    goal: Turn raw health numbers into a ServerStatus a user can act on, with no I/O.
    context: The required-column set already exists at serve/tools/read_only_gate.py:33-59. Lift it to one shared constant rather than writing a second copy.
    behaviors:
      - id: B-1
        given: health numbers, per-table column sets, resolved settings and a tool list
        when: status() is called
        then: it returns a ServerStatus and performs no I/O
      - id: B-2
        given: a latest ingest four minutes old
        when: status() runs
        then: latest_ingest_age_seconds is approximately 240 and connected is True
      - id: B-3
        given: findings missing confidence_score
        when: status() runs
        then: contract_tables lists the column and remediation names both it and the infra lane
      - id: B-4
        given: a reachable store with zero rows
        when: status() runs
        then: connected is True and remediation says the store is empty, not broken
    evals:
      - id: eval_1
        description: all four assembler behaviors are covered by passing tests
        command: ( cd serve && uv run --extra dev pytest tests/test_status.py -q )
        verifies: [B-1, B-2, B-3, B-4]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the assembler performs no I/O
        command: ( cd serve && ! grep -nE '(get_client|clickhouse_connect|ReadStore\()' src/apex_mcp/diagnose.py )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Calling get_client() or a ReadStore from inside status().
      - Building remediation text out of observed data; remediation is Apex's own string.
      - Reporting connected=True because the process is alive rather than a query returning.
    do_not_touch:
      - serve/src/apex_mcp/ch.py
      - serve/src/apex_mcp/server.py

  - id: T-20260817-status-degraded-path
    title: Make status survive an unreachable store
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-status-assembler]
    touches_paths: [serve/src/apex_mcp/diagnose.py, serve/tests/test_status.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: A status call that fails when the database is down only works when you do not need it.
    goal: Return a degraded ServerStatus carrying the sanitized code and a next action, instead of raising.
    context: get_client() is lazy by design at ch.py:302, so the server lists tools with the database down. This task pays that back.
    behaviors:
      - id: B-1
        given: a store whose every query raises ApexStoreError
        when: status() is called
        then: it returns ServerStatus(connected=False) and does not raise
      - id: B-2
        given: that same failure
        when: the result is read
        then: degraded_reason carries the sanitized code and remediation carries a next action
      - id: B-3
        given: a store raising a non-ApexStoreError exception
        when: status() is called
        then: that exception propagates
      - id: B-4
        given: any degraded response
        when: it is serialized
        then: no credential appears in any field including degraded_reason
    evals:
      - id: eval_1
        description: the degraded-path tests pass
        command: ( cd serve && uv run --extra dev pytest tests/test_status.py -q -k degraded )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: a sentinel password never reaches a degraded response
        command: ( cd serve && CLICKHOUSE_PASSWORD='sentinel-pw-do-not-leak' uv run --extra dev pytest tests/test_status.py -q )
        verifies: [B-4]
        terminal: true
        expected_duration_sec: 30
    anti_patterns:
      - A bare except Exception, which turns a real bug into a database-down report.
      - Re-deriving remediation from the exception message instead of mapping the sanitized code.
      - Retry loops; status reports, it does not repair.
    do_not_touch:
      - serve/src/apex_mcp/ch.py

  - id: T-20260817-register-apex-status
    title: Register the apex_status tool
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-status-assembler, T-20260817-status-degraded-path, T-20260817-store-health-query, T-20260817-table-columns-probe]
    touches_paths: [serve/src/apex_mcp/server.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: This is the commit where the lane stops having four tools; keeping it alone makes the surface change legible in git log.
    goal: Expose apex_status as a fifth read-only tool wired to store_health, table_columns and diagnose.status.
    context: The four-tools test is expected to fail after this task and is repaired by its own follow-up unit. Any other failure means this task broke something.
    behaviors:
      - id: B-1
        given: a built server
        when: list_tools() is called
        then: apex_status is present with readOnlyHint True and openWorldHint False
      - id: B-2
        given: apex_status is invoked with a reachable store
        then: it returns schema-valid structured output matching ServerStatus
        when: the response is validated
      - id: B-3
        given: the server module
        when: its docstring is read
        then: it describes five tools and still states that stdout is the JSON-RPC channel
    evals:
      - id: eval_1
        description: the tool is listed read-only with the correct annotations
        command: ( cd serve && uv run python -c "import asyncio; from apex_mcp.server import create_server; from apex_mcp.ch import ReadStore; from tests.conftest import FakeClient; s=create_server(ReadStore(FakeClient())); t={x.name:x for x in asyncio.run(s.list_tools())}; assert 'apex_status' in t, sorted(t); a=t['apex_status'].annotations; assert a.readOnlyHint and a.openWorldHint is False, a" )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 20
      - id: eval_2
        description: the module docstring no longer claims four tools
        command: ( cd serve && ! grep -n 'Four tools' src/apex_mcp/server.py )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Repairing the failing four-tools assertion in this unit.
      - Annotating with PROPOSAL_ONLY instead of READ_ONLY.
      - Adding parameters; apex_status takes none in v1 and so has no injection surface.
    do_not_touch:
      - serve/tests/test_server_tools.py
      - serve/src/apex_mcp/diagnose.py

  - id: T-20260817-five-tools-assertion
    title: Re-pin the tool surface assertion at five
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-register-apex-status]
    touches_paths: [serve/tests/test_server_tools.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: An accidental tool on a server a model can call is a security event; the exact ordered assertion is the control that prevents it.
    goal: Move the exact ordered tool-name assertion from four names to five, keeping it an equality.
    context: test_exactly_the_four_contracted_tools asserts an exact ordered list. Keep that strictness.
    behaviors:
      - id: B-1
        given: the built server
        when: list_tools() is called
        then: the assertion compares against an exact ordered list of five names
      - id: B-2
        given: a sixth tool were added
        when: the suite runs
        then: it fails, because the assertion is neither a subset nor a count
    evals:
      - id: eval_1
        description: the full serve suite is green again
        command: ( cd serve && uv run --extra dev pytest -q )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 60
      - id: eval_2
        description: the assertion is still an ordered equality, not a subset or count
        command: ( cd serve && ! grep -nE '(issubset|len\(tools\)|set\(\[t\.name)' tests/test_server_tools.py )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Relaxing the assertion to a subset or a count so it stops needing maintenance.
      - Bundling any source change into this unit.
    do_not_touch:
      - serve/src/apex_mcp/server.py

  - id: T-20260817-status-store-down-e2e
    title: Prove status answers through the tool boundary while the store is down
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-register-apex-status, T-20260817-five-tools-assertion]
    touches_paths: [serve/tests/test_server_tools.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: Between the pure function and the client sit create_server, _fail() and FastMCP serialization, any of which could turn a degraded response back into an error.
    goal: Assert end-to-end that apex_status returns data, not an error, when every query raises.
    context: conftest already provides FakeClient; extend it rather than repointing fixtures other suites rely on.
    behaviors:
      - id: B-1
        given: a FakeClient that raises on every query
        when: apex_status is invoked through the built server
        then: it returns schema-valid ServerStatus with connected False
      - id: B-2
        given: the same call
        when: the response is inspected
        then: no ApexStoreError reached the client as a tool error
      - id: B-3
        given: CLICKHOUSE_PASSWORD set to a sentinel
        when: the degraded response is serialized
        then: the sentinel appears nowhere in it
    evals:
      - id: eval_1
        description: the tool-surface suite passes with the store-down case
        command: ( cd serve && uv run --extra dev pytest tests/test_server_tools.py -q )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the whole suite stays green with a sentinel password exported
        command: ( cd serve && CLICKHOUSE_PASSWORD='sentinel-pw-do-not-leak' uv run --extra dev pytest -q )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Asserting on exact remediation wording instead of the response shape.
      - Calling diagnose.status() directly; the value of this unit is going through the server.
    do_not_touch:
      - serve/src/apex_mcp

  # ---------------- B — actionable configuration errors ----------------
  - id: T-20260817-resolve-settings-extract
    title: Extract resolve_settings out of get_client
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-table-columns-probe]
    touches_paths: [serve/src/apex_mcp/ch.py, serve/tests/test_ch.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: Nothing can ask which host was resolved without constructing a client - which is exactly the question you need answered when the client cannot be constructed.
    goal: Make the resolved configuration inspectable without opening a connection.
    context: The six os.getenv calls are inline inside the lru_cached factory at ch.py:302-324. Return a frozen dataclass plus a defaulted tuple naming the unset variables.
    behaviors:
      - id: B-1
        given: no CLICKHOUSE_ variables
        when: resolve_settings() is called
        then: it returns today's defaults and defaulted lists all six
      - id: B-2
        given: every variable set
        when: resolve_settings() is called
        then: it reflects them and defaulted is empty
      - id: B-3
        given: CLICKHOUSE_SECURE in 1, true or yes in any case
        when: resolved
        then: secure is True and any other value is False, matching current behavior
      - id: B-4
        given: get_client()
        when: called
        then: it behaves as before, now via resolve_settings()
    evals:
      - id: eval_1
        description: the ClickHouse layer suite passes with the settings tests
        command: ( cd serve && uv run --extra dev pytest tests/test_ch.py -q )
        verifies: [B-1, B-2, B-3, B-4]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: password is not a field on the settings dataclass
        command: ( cd serve && uv run python -c "from apex_mcp.ch import resolve_settings as r; s=r(); assert not hasattr(s,'password'), 'password must not be a settings field'; assert hasattr(s,'defaulted')" )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 15
    anti_patterns:
      - Putting password on the returned dataclass; it is needed only by get_client().
      - Caching resolve_settings(), which would return a stale answer after the env changes.
    do_not_touch:
      - serve/src/apex_mcp/models.py
      - serve/src/apex_mcp/server.py

  - id: T-20260817-name-endpoint-in-error
    title: Name the resolved endpoint in the unavailable error
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-resolve-settings-extract]
    touches_paths: [serve/src/apex_mcp/ch.py, serve/tests/test_injection_hardening.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: The message names no value, so a user cannot tell whether the server tried the host they meant.
    goal: Include host, port and database in the connection-failure message while keeping user and password out.
    context: This pulls against the security rail at ch.py:274. The endpoint is configuration the user supplied; the credential is not. Only the first moves.
    behaviors:
      - id: B-1
        given: a connection failure against a configured endpoint
        when: the error surfaces
        then: the message contains host, port and database
      - id: B-2
        given: CLICKHOUSE_PASSWORD set to a sentinel
        when: any sanitized error is produced
        then: the sentinel appears in none of them
      - id: B-3
        given: a connection failure
        when: the message is read
        then: CLICKHOUSE_USER does not appear
      - id: B-4
        given: a driver exception carrying a full DSN in its own text
        when: sanitized
        then: none of that original text is forwarded
    evals:
      - id: eval_1
        description: the disclosure suite passes with the endpoint assertions
        command: ( cd serve && uv run --extra dev pytest tests/test_injection_hardening.py -q )
        verifies: [B-1, B-3, B-4]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: neither sentinel credential escapes with both exported
        command: ( cd serve && CLICKHOUSE_PASSWORD='sentinel-pw-do-not-leak' CLICKHOUSE_USER='sentinel-user' uv run --extra dev pytest -q )
        verifies: [B-2, B-3]
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Interpolating str(exc) into the returned message; driver text is where the DSN lives.
      - Adding the username on the grounds that it is not the password.
      - Widening the same treatment to clickhouse_query_failed.
    do_not_touch:
      - serve/src/apex_mcp/server.py

  - id: T-20260817-startup-stderr-banner
    title: Log one resolved-configuration banner to stderr at startup
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-resolve-settings-extract, T-20260817-status-store-down-e2e]
    touches_paths: [serve/src/apex_mcp/server.py, serve/tests/test_server_tools.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: MCP servers are spawned by a client whose config the user may not have written; when Apex looks empty the first need is proof of which endpoint it resolved.
    goal: Emit one stderr line naming host, port, database and secure, with stdout untouched.
    context: stdout is the JSON-RPC channel. Nothing in src/apex_mcp may print().
    behaviors:
      - id: B-1
        given: the server starts
        when: it initializes
        then: one line on stderr names host, port, database and secure
      - id: B-2
        given: the server is launched with immediate EOF
        when: it exits
        then: stdout received zero bytes
      - id: B-3
        given: CLICKHOUSE_PASSWORD is set
        when: the banner is written
        then: the password does not appear in any form
      - id: B-4
        given: APEX_LOG_LEVEL=WARNING
        when: the server starts
        then: the banner is suppressed, because it is a log line and not a print
    evals:
      - id: eval_1
        description: the tool-surface suite passes with the banner test
        command: ( cd serve && uv run --extra dev pytest tests/test_server_tools.py -q )
        verifies: [B-1, B-4]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: a live launch writes zero bytes to stdout and leaks no password to stderr
        command: ( cd serve && CLICKHOUSE_PASSWORD='sentinel-pw-do-not-leak' uv run apex-mcp </dev/null >/tmp/apex-stdout.bin 2>/tmp/apex-stderr.txt; test ! -s /tmp/apex-stdout.bin && ! grep -q 'sentinel-pw' /tmp/apex-stderr.txt && grep -qi 'clickhouse' /tmp/apex-stderr.txt )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 30
    anti_patterns:
      - print() anywhere in src/apex_mcp for any reason.
      - Logging the password even masked; do not read it here at all.
      - Emitting the banner at module import rather than in main().
    do_not_touch:
      - serve/src/apex_mcp/ch.py

  - id: T-20260817-surface-defaulted-vars
    title: Surface defaulted environment variables in ServerStatus
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-serverstatus-model, T-20260817-resolve-settings-extract, T-20260817-status-assembler, T-20260817-status-degraded-path, T-20260817-startup-stderr-banner]
    touches_paths: [serve/src/apex_mcp/diagnose.py, serve/src/apex_mcp/server.py, serve/tests/test_status.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: The commonest way Apex looks broken is a default endpoint the user never chose, and every variable has a working local default, so the failure is silent.
    goal: Let apex_status report which CLICKHOUSE_ variables were never set, by name only.
    context: Sized M rather than S because the write surface is three paths - the assembler, the tool body and the tests. Reclassified up rather than split, since it is one coherent change.
    behaviors:
      - id: B-1
        given: no CLICKHOUSE_ variables set
        when: apex_status() is called
        then: using_defaults lists all six variable names
      - id: B-2
        given: all six set
        when: apex_status() is called
        then: using_defaults is empty
      - id: B-3
        given: using_defaults is non-empty and the store is empty
        when: the result is read
        then: remediation connects the two as a probable wrong-endpoint case
      - id: B-4
        given: any response
        when: it is serialized
        then: using_defaults contains variable names only, never their values
    evals:
      - id: eval_1
        description: the defaults behaviors pass with the environment cleared
        command: ( cd serve && env -u CLICKHOUSE_HOST -u CLICKHOUSE_PORT -u CLICKHOUSE_USER -u CLICKHOUSE_PASSWORD -u CLICKHOUSE_DATABASE -u CLICKHOUSE_SECURE uv run --extra dev pytest tests/test_status.py -q )
        verifies: [B-1, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the full suite stays green and no variable value is emitted
        command: ( cd serve && CLICKHOUSE_PASSWORD='sentinel-pw-do-not-leak' uv run --extra dev pytest -q )
        verifies: [B-2, B-4]
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Including values; CLICKHOUSE_PASSWORD is one of the six names.
      - Treating defaults as an error, since a local dev stack legitimately runs on all six.
    do_not_touch:
      - serve/src/apex_mcp/ch.py

  # ---------------- C — PyPI packaging ----------------
  - id: T-20260817-pypi-metadata
    title: Add PyPI metadata to the serve pyproject
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths: [serve/pyproject.toml]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: Until the package is publishable every install path needs uvx --from a path, which is the difference between one command and a paragraph.
    goal: Carry readme, license, authors, keywords, classifiers and project urls in the wheel metadata.
    context: The repository is now Apache-2.0 licensed, which settles the licence question this unit previously carried as open.
    behaviors:
      - id: B-1
        given: the project
        when: built
        then: the wheel metadata carries readme, license, authors, keywords, classifiers and urls
      - id: B-2
        given: the built artifacts
        when: twine check runs
        then: every one reports PASSED
      - id: B-3
        given: the dependency pins
        when: read
        then: mcp[cli]>=1.27,<2 is unchanged, because the upper bound is a researched decision
    evals:
      - id: eval_1
        description: metadata is complete and the pin survived
        command: ( cd serve && uv run python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']; need={'readme','license','authors','keywords','classifiers','urls'}; missing=need-p.keys(); assert not missing, missing; assert p['dependencies'][0].startswith('mcp[cli]>=1.27,<2'), p['dependencies'][0]" )
        verifies: [B-1, B-3]
        terminal: true
        expected_duration_sec: 15
      - id: eval_2
        description: the built wheel and sdist pass twine check
        command: ( cd serve && rm -rf dist && uv build >/dev/null && uvx twine check dist/* | grep -q PASSED )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 120
    anti_patterns:
      - Bumping version here; publishing is a separate unit.
      - Relaxing the mcp upper bound while in the file.
      - Rewriting serve/README.md to please the PyPI renderer.
    do_not_touch:
      - serve/src/apex_mcp

  - id: T-20260817-wheel-content-check
    title: Assert the wheel ships the package and nothing else
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-pypi-metadata]
    touches_paths: [serve/pyproject.toml]
    creates_paths: [serve/tests/test_packaging.py]
    source_note: docs/lanes/L1_tasks.md
    why: serve/tools holds two live gates that write fixture rows to ClickHouse; shipping them would put a seeding script into every user's environment.
    goal: Prove the built wheel contains only apex_mcp and its dist-info.
    context: The wheel target already names packages = src/apex_mcp, but nothing asserts it. Expect zero config change - this unit usually only proves the current setting.
    behaviors:
      - id: B-1
        given: a built wheel
        when: its contents are listed
        then: every entry is under apex_mcp/ or the dist-info directory
      - id: B-2
        given: a built wheel
        when: its contents are listed
        then: no path contains tests/, tools/ or scripts/
      - id: B-3
        given: the sdist
        when: inspected
        then: it contains README.md and pyproject.toml, enough to rebuild from source
    evals:
      - id: eval_1
        description: the packaging test passes
        command: ( cd serve && uv run --extra dev pytest tests/test_packaging.py -q )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 60
      - id: eval_2
        description: the artifact itself contains no test, tool or script path
        command: ( cd serve && rm -rf dist && uv build >/dev/null && uv run python -c "import glob,zipfile; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); bad=[x for x in n if not (x.startswith('apex_mcp/') or '.dist-info/' in x)]; assert not bad, bad; assert not [x for x in n if any(p in x for p in ('tests/','tools/','scripts/'))]; print(len(n),'entries in-package')" )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 120
    anti_patterns:
      - Adding tools/ to the wheel so users can run the gates; the gates seed fixture rows.
      - Excluding files via gitignore and assuming the build honors it; assert on the artifact.
    do_not_touch:
      - serve/src/apex_mcp

  - id: T-20260817-testpypi-rehearsal
    title: Rehearse the publish on TestPyPI
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-wheel-content-check, T-20260817-four-to-five-doc-ripple]
    touches_paths: [serve/VALIDATION.md]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: A PyPI release is immutable, so the first exercise of the one-command install must not be against the real index.
    goal: Publish a dev version to TestPyPI and install it clean, recording the result.
    context: Requires a TestPyPI API token, so the upload step is human-gated. Use a devN suffix so the real release number stays clean.
    behaviors:
      - id: B-1
        given: built artifacts
        when: uploaded to TestPyPI
        then: the upload succeeds and the project page renders the README
      - id: B-2
        given: a directory with no local checkout
        when: uvx installs from the TestPyPI index
        then: the server starts and blocks on stdin with zero bytes on stdout
      - id: B-3
        given: the installed package
        when: its dependencies resolve
        then: mcp and clickhouse-connect come from real PyPI via the extra index
    evals:
      - id: eval_1
        description: a clean install from TestPyPI launches with a silent stdout
        command: ( cd /tmp && uvx --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ apex-mcp </dev/null >/tmp/tp-stdout.bin 2>/tmp/tp-stderr.txt; test ! -s /tmp/tp-stdout.bin )
        verifies: [B-2, B-3]
        terminal: true
        expected_duration_sec: 180
      - id: eval_2
        description: the rehearsal outcome is recorded in the lane validation record
        command: ( cd serve && grep -qi 'testpypi' VALIDATION.md )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Reusing the version number intended for the real release; TestPyPI is immutable per version too.
      - Testing from inside serve/, where a local install can satisfy the import and produce a false pass.
      - Omitting the extra index and then vendoring a dependency to make resolution succeed.
    do_not_touch:
      - serve/pyproject.toml

  - id: T-20260817-pypi-publish
    title: Publish apex-mcp to PyPI
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-testpypi-rehearsal]
    touches_paths: [serve/VALIDATION.md]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: Split from the config edits because publishing is one-way and editing configs before the upload succeeds would point the repo at a package that does not exist.
    goal: Upload the release and verify a clean-machine uvx apex-mcp launch.
    context: Requires PyPI credentials and a confirmed distribution name. Build from a clean tree so the artifact matches a commit.
    behaviors:
      - id: B-1
        given: a released version
        when: uvx apex-mcp runs on a machine with no local checkout
        then: the server starts, blocks on stdin and writes zero bytes to stdout
      - id: B-2
        given: the release
        when: the user registers it with an MCP client
        then: the client reports the apex server as connected
    evals:
      - id: eval_1
        description: a clean uvx install from real PyPI launches with a silent stdout
        command: ( cd /tmp && uvx apex-mcp </dev/null >/tmp/p-stdout.bin 2>/tmp/p-stderr.txt; test ! -s /tmp/p-stdout.bin )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 180
      - id: eval_2
        description: the published release is recorded in the lane validation record
        command: ( cd serve && grep -qiE 'published|pypi release' VALIDATION.md )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Publishing before the TestPyPI rehearsal passed; the version is immutable and a broken release is permanent.
      - Publishing from a dirty tree.
      - Editing any .mcp.json or README in this unit; that is the follow-up.
    do_not_touch:
      - .mcp.json
      - serve/.mcp.json
      - serve/README.md

  - id: T-20260817-drop-from-path
    title: Drop the uvx --from fallback now that the package is published
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-pypi-publish, T-20260817-root-mcp-json, T-20260817-four-to-five-doc-ripple]
    touches_paths: [.mcp.json, serve/.mcp.json, serve/README.md]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: serve/.mcp.json already carries the instruction to make this change once the package is published; this unit executes that note.
    goal: Point every client config and document at plain uvx apex-mcp.
    context: Sized M because the write surface is three paths. Runs only after the upload succeeds.
    behaviors:
      - id: B-1
        given: both .mcp.json files
        when: read
        then: args is exactly ["apex-mcp"] and the comment no longer instructs a future reader to make this change
      - id: B-2
        given: serve/README.md
        when: read
        then: the --from path fallback is gone
    evals:
      - id: eval_1
        description: no config or document still references the --from fallback
        command: ( ! grep -rn -- '--from' .mcp.json serve/.mcp.json serve/README.md )
        verifies: [B-1, B-2]
        terminal: true
        expected_duration_sec: 10
      - id: eval_2
        description: both configs invoke the published console script directly
        command: ( python3 -c "import json; a=json.load(open('.mcp.json')); b=json.load(open('serve/.mcp.json')); assert a['mcpServers']['apex']['args']==['apex-mcp'], a['mcpServers']['apex']['args']; assert a['mcpServers']==b['mcpServers']" )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 10
    anti_patterns:
      - Running this before the upload succeeded, which points the repo at a package that does not exist.
      - Letting the root and serve copies diverge while editing them.
    do_not_touch:
      - serve/pyproject.toml
      - serve/src/apex_mcp

  # ---------------- D — client config parity ----------------
  - id: T-20260817-root-mcp-json
    title: Add the root .mcp.json with a drift test
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: []
    touches_paths: []
    creates_paths: [.mcp.json, serve/tests/test_config_parity.py]
    source_note: docs/lanes/L1_tasks.md
    why: serve/.mcp.json documents that it must be copied to the repository root to activate, and nothing performs that copy, so project scope is an instruction nobody executed.
    goal: Ship the root config as a real file and guard the duplication with a test.
    context: This repo already carries two hand-maintained copies of one schema in infra/sql and collect/ddl, and W0 is the bill for that going unchecked.
    behaviors:
      - id: B-1
        given: a fresh clone
        when: a client opens the repo
        then: the root .mcp.json is found with no manual step
      - id: B-2
        given: both files
        when: parsed
        then: their mcpServers blocks are identical and only the comment key may differ
      - id: B-3
        given: either file edited alone
        when: the suite runs
        then: the parity test fails and names both paths
      - id: B-4
        given: the root file
        when: inspected
        then: it is a regular file and not a symlink
    evals:
      - id: eval_1
        description: the parity test passes
        command: ( cd serve && uv run --extra dev pytest tests/test_config_parity.py -q )
        verifies: [B-2, B-3]
        terminal: true
        expected_duration_sec: 30
      - id: eval_2
        description: the root config is a regular file whose server block matches serve
        command: ( test -f .mcp.json && test ! -L .mcp.json && python3 -c "import json; a=json.load(open('.mcp.json')); b=json.load(open('serve/.mcp.json')); assert a['mcpServers']==b['mcpServers']" )
        verifies: [B-1, B-4]
        terminal: true
        expected_duration_sec: 10
    anti_patterns:
      - Using a symlink; Codex on Windows and some client sandboxes do not follow them.
      - Generating the root file at build time; it must exist in a fresh clone.
      - Redesigning the mcpServers content, which is settled.
    do_not_touch:
      - serve/src/apex_mcp

