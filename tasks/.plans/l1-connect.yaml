  # ---------------- E — gates and docs ----------------
  - id: T-20260817-gate-status-assert
    title: Assert apex_status in the live read-only gate
    effort: S
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-register-apex-status, T-20260817-surface-defaulted-vars]
    touches_paths: [serve/tools/read_only_gate.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: A FakeClient returns whatever column set the test author typed, so only a real database can validate a tool that reports on schema conformance.
    goal: Prove apex_status against live ClickHouse, cross-checked against the gate's own DESCRIBE.
    context: The gate already performs an independent DESCRIBE at read_only_gate.py:73. Compare the tool's answer to that, not to the code under test.
    behaviors:
      - id: B-1
        given: a live store with the gate's seeded rows
        when: apex_status() is called
        then: connected is True and run_count is greater than zero
      - id: B-2
        given: the same call
        when: contract_tables is read
        then: it agrees with the gate's independent DESCRIBE for all three tables
      - id: B-3
        given: freshly seeded rows
        when: status reports
        then: latest_ingest_age_seconds is small and positive
      - id: B-4
        given: the gate completes
        when: it prints its JSON
        then: a status block is included and the overall result is passed
    evals:
      - id: eval_1
        description: the live gate passes and its status block agrees with DESCRIBE
        command: ( cd serve && uv run python tools/read_only_gate.py > /tmp/gate.json && uv run python -c "import json; g=json.load(open('/tmp/gate.json')); assert g['status']=='passed', g; s=g['status_tool']; assert s['connected'] and s['run_count']>0, s; assert s['contract_tables']==g['describe_missing'], (s['contract_tables'], g['describe_missing'])" )
        verifies: [B-1, B-2, B-4]
        terminal: true
        expected_duration_sec: 120
      - id: eval_2
        description: the reported ingest age is small and positive for freshly seeded rows
        command: ( cd serve && uv run python -c "import json; s=json.load(open('/tmp/gate.json'))['status_tool']; a=s['latest_ingest_age_seconds']; assert a is not None and 0 <= a < 3600, a" )
        verifies: [B-3]
        terminal: true
        expected_duration_sec: 10
    anti_patterns:
      - Building the expected column set from table_columns(), which compares the code under test to itself.
      - Weakening the gate's guarantee that it deletes only its own fixture rows.
      - Rewriting the existing conformance, argMax or injection assertions.
    do_not_touch:
      - serve/src/apex_mcp

  - id: T-20260817-stdio-gate-five-tools
    title: Assert five tools in the real stdio MCP gate
    effort: XS
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-register-apex-status]
    touches_paths: [serve/tools/mcp_stdio_gate.py]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: The in-process test skips JSON-RPC framing, the client handshake and serialization - exactly where a stray stdout byte or a rejected schema would appear.
    goal: Confirm the fifth tool over a real MCP client on real stdio.
    context: Keep the suggest_fix assertions untouched; they pin the lane's headline safety claims over the wire.
    behaviors:
      - id: B-1
        given: the server spawned over stdio
        when: the official client lists tools
        then: it sees exactly five, apex_status among them
      - id: B-2
        given: that listing
        when: annotations are read
        then: apex_status carries readOnlyHint true and openWorldHint false
      - id: B-3
        given: apex_status invoked through the client
        when: the response returns
        then: it is schema-valid structured output
      - id: B-4
        given: the whole session
        when: it completes
        then: no framing error occurred
    evals:
      - id: eval_1
        description: the stdio gate passes end to end
        command: ( cd serve && uv run python tools/mcp_stdio_gate.py )
        verifies: [B-1, B-2, B-3, B-4]
        terminal: true
        expected_duration_sec: 120
      - id: eval_2
        description: the gate no longer claims a four-tool surface
        command: ( cd serve && ! grep -n 'four contracted tools' tools/mcp_stdio_gate.py )
        verifies: [B-1]
        terminal: true
        expected_duration_sec: 5
    anti_patterns:
      - Softening the assertion to contains apex_status; the value is pinning the exact surface a client sees.
      - Skipping the annotation assertion, since the annotation is what the client acts on.
    do_not_touch:
      - serve/src/apex_mcp

  - id: T-20260817-four-to-five-doc-ripple
    title: Close the four-to-five documentation ripple
    effort: M
    profile: standard
    agent: any
    execution_backend: any
    depends_on: [T-20260817-register-apex-status, T-20260817-gate-status-assert, T-20260817-stdio-gate-five-tools, T-20260817-cursor-codex-config]
    touches_paths: [serve/README.md, serve/VALIDATION.md, docs/lanes/SERVE.md]
    creates_paths: []
    source_note: docs/lanes/L1_tasks.md
    why: VALIDATION.md records what was observed, so a stale record is a false one.
    goal: Leave no document claiming four tools, with a test count copied from an actual run.
    context: Thirteen sites assert the four-tool surface across code, tests, gates and three documents. Source docstrings are handled by their own units; this one closes the prose. Sized M for three document paths.
    behaviors:
      - id: B-1
        given: serve/README.md
        when: read
        then: the tool table has five rows and the prose and install comment match
      - id: B-2
        given: serve/VALIDATION.md
        when: read
        then: the scope table lists apex_status and the test count matches the suite's actual output
      - id: B-3
        given: docs/lanes/SERVE.md
        when: read
        then: the mission statement and the T11 accept criterion both say five
    evals:
      - id: eval_1
        description: no document or gate still claims a four-tool surface
        command: ( ! grep -rniE 'four tools|exactly 4 tools|four contracted|all four' serve/ docs/lanes/SERVE.md --include='*.md' --include='*.py' )
        verifies: [B-1, B-2, B-3]
        terminal: true
        expected_duration_sec: 10
      - id: eval_2
        description: the recorded test count equals the count the suite actually reports
        command: ( cd serve && n=$(uv run --extra dev pytest 2>&1 | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+') && grep -q "$n passed" VALIDATION.md )
        verifies: [B-2]
        terminal: true
        expected_duration_sec: 60
    anti_patterns:
      - Writing a test count from memory instead of copying it from a run.
      - Recording gate results without rerunning the gates.
      - Editing the SERVE.md T1-T14 checklist, which records what shipped.
    do_not_touch:
      - serve/src/apex_mcp
      - serve/tests

  - id: T-20260817-graphify-rebuild
    title: Rebuild the graphify knowledge graph for L1
