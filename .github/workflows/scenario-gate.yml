name: Apex Scenario Gate
on:
  pull_request:
    branches: [ main ]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Testes
        run: python3 -m pytest tests/ -v
      - name: Slice por cenario
        run: |
          for s in scenarios/*.yaml; do
            # Mundo B (listener_*) nao tem code_generator/plan_generator — fora do gate
            grep -q '^code_generator:' "$s" || { echo "skip (world B): $s"; continue; }
            klass=$(python3 -c "import yaml; print(yaml.safe_load(open('$s')).get('anti_pattern',{}).get('class','none'))")
            echo "### $s [$klass]"
            python3 generators/code_generator.py "$s" job.py
            python3 generators/plan_generator.py "$s" log.ndjson
            # dispatch por classe: skew -> skew_watcher; demais -> pattern_watcher;
            # baseline (none) passa pelos DOIS (zero falso positivo em todos os detectores)
            if [ "$klass" = "data_skew_on_join_key" ] || [ "$klass" = "none" ]; then
              python3 watchers/skew_watcher.py "$s" log.ndjson
            fi
            if [ "$klass" != "data_skew_on_join_key" ]; then
              python3 watchers/pattern_watcher.py "$s" log.ndjson
            fi
          done
