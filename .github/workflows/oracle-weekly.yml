name: Oracle — Validação semanal (sintético vs real)

on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda-feira às 6h UTC
  workflow_dispatch:        # disparo manual quando necessário

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Baixar event log real do MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          python scripts/fetch_real_log.py \
            --bucket spark-logs \
            --prefix events/ \
            --output real_log.ndjson

      - name: Gerar sintético dos cenários
        run: |
          for s in scenarios/*.yaml; do
            python generators/plan_generator.py "$s" synthetic_log.ndjson
            python oracle/compare.py "$s" synthetic_log.ndjson real_log.ndjson
          done

      # Se on_divergence: fail_and_open_issue — abrir issue via GitHub API
      - name: Abrir issue em caso de divergência
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[BLOCKER] Oracle divergiu — sintético não corresponde ao real',
              body: 'Oracle semanal detectou divergência. Ver run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['priority:p0', 'type:blocker', 'crew-a']
            })
