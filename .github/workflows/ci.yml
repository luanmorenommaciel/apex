name: CI

# Lean default CI. Every lane is a separate project with its own dependency set.
# Tests that need live ClickHouse skip themselves, which keeps this workflow
# fast and service-free; live end-to-end paths are not covered here.
#
#   pull_request -> main, push -> main : front + python lanes + repo checks
#   (ubuntu only). Feature-branch pushes no longer run CI on their own; the PR
#   run covers them, so each change is checked once, not twice.
#   The Scala jar lives in jar.yml (path-scoped; full JDK matrix weekly/manual).
#   Docs/markdown-only changes skip CI.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "jar/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "jar/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    name: front (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: install dependencies
        working-directory: front
        run: npm ci
      - name: typecheck
        working-directory: front
        run: npm run typecheck
      - name: lint
        working-directory: front
        run: npm run lint
      - name: test
        working-directory: front
        run: npm test -- --run
      - name: build
        working-directory: front
        run: npm run build

  python:
    # One job for all Python lanes (was 6 jobs): same tests, one runner
    # start-up instead of six. Every lane runs even if an earlier one fails.
    name: python lanes + root gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pytest per lane (engine, serve, memory, verify, dev)
        run: |
          fail=0
          for lane in engine serve memory verify dev; do
            echo "::group::${lane} (py)"
            if (cd "$lane" && uv run --extra dev pytest -q -p no:warnings); then
              echo "${lane}: PASS"
            else
              echo "::error::${lane} (py) failed"; fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
      - name: Verify PowerShell 7
        run: |
          # shellcheck disable=SC2016
          pwsh -NoProfile -Command '$version = $PSVersionTable.PSVersion; if ($version.Major -lt 7) { throw "PowerShell 7 or newer is required; found $version" }; Write-Output "POWERSHELL_VERSION=$version"'
      # Driven from engine's environment: the gate imports apex_engine and
      # apex_mcp, and engine's project pins both.
      - name: root six-lane gate (pytest tests/)
        working-directory: engine
        run: uv run --extra dev pytest ../tests -q -p no:warnings

  repo-checks:
    name: repo checks (license + collector config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The README calls Apex open. Without a LICENSE that is legally false, so
      # assert the file exists rather than trusting it stays there.
      - name: license present
        run: test -f LICENSE && grep -q "Apache License" LICENSE
      # A malformed collector pipeline is invisible until telemetry silently
      # stops arriving, which already cost this project 50-70% of its events
      # once. Validate the config without starting anything.
      # Every ${env:...} the config references must be supplied or validation fails
      # on the FIRST missing one and hides the rest. CLICKHOUSE_ENDPOINT is not
      # optional: the clickhouse exporter parses it as a DSN at load time.
      # tcp:// selects the native protocol — never mix tcp:// with the 8123 HTTP port.
      - name: otelcol validate
        working-directory: collect
        run: |
          docker run --rm \
            -e "REDACTION_SECRET_KEY=$(openssl rand -hex 32)" \
            -e CLICKHOUSE_ENDPOINT=tcp://clickhouse:9000 \
            -e CLICKHOUSE_USER=apex \
            -e CLICKHOUSE_PASSWORD=ci_placeholder \
            -v "$PWD/config.yaml:/c.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.156.0 validate --config /c.yaml
