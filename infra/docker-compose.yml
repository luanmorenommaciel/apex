# Apex infra · the REAL, persistent ClickStack — the canonical data platform the whole
# pipeline stores into and visualizes from. Four services:
#
#   otel-collector ──native:9000──> clickhouse <──HTTP:8123── hyperdx(app) ──state──> mongodb
#        ▲ OTLP :4318                (apex DB, contract schema + rollups + reshape MVs)
#        │
#   jar / collect  (a POSTed apex.stage span -> otel_traces -> MV -> spark_events)
#
# MongoDB is REQUIRED: HyperDX stores dashboards/sources/connections/users in Mongo, NOT in
# ClickHouse. The all-in-one image loses that on restart — this compose stack persists it.
#
# IMAGES ARE PINNED BY DIGEST (tag@sha256). A tag is a moving pointer; the digest is the
# build that was tested. Bump = change the tag AND the digest together (.env.example says how).
# Every long-running service restarts unless-stopped and carries a memory limit, so the
# OOM killer the root README warns about hits the one container that overgrew, not all four.
#
# NO DEFAULT CREDENTIALS. CLICKHOUSE_PASSWORD and HYPERDX_API_KEY must come from .env;
# `docker compose config` fails without them, and scripts/preflight.sh (run by `make up`)
# refuses the placeholder values a copied .env.example would carry.
# LOOPBACK BY DEFAULT. Every published port binds to ${BIND_HOST:-127.0.0.1}; other lanes
# reach these services over the Docker network by container name, never via a host port,
# so nothing on the LAN sees a no-password console user or an admin ClickHouse.
#
# Host ports are parametrized via .env (CONTRACT Port Map defaults live in .env.example).
# On the shared dev host the stray oteru-collector squats 8123/9000/4318, so the local .env
# shifts ClickHouse->28123/29000 and the collector->24318/24317; HyperDX stays on 8090 (Port Map).
#
# SHARED-NETWORK ALIAS RULE (postmortem: the lost-telemetry bug).
# Compose gives every service a short network alias equal to its service name
# (`clickhouse`, `otel-collector`, ...). On a network SHARED with another lane's stack
# (e.g. apex-collect-net, whose throwaway ClickHouse is also reachable as `clickhouse`),
# that short alias resolves to BOTH containers and Docker DNS round-robins between them —
# spans written to the wrong ClickHouse land in a DB with no reshape MVs and vanish.
# Rule, enforced below by construction:
#   1. Every infra service carries an explicit alias equal to its GLOBALLY-UNIQUE
#      container_name (apex-infra-*). Container names are unique per Docker daemon, so
#      these aliases can never collide, no matter which network the stack is joined to.
#   2. Infra-internal references (collector exporter, HyperDX connection, Mongo URI)
#      use ONLY the qualified apex-infra-* alias — never the short service name — so a
#      foreign container squatting the short name cannot intercept infra traffic.
#   3. NEVER `docker network connect --alias <other-lane-name>` an infra container onto
#      another lane's network (that is exactly how apex-infra-otel-collector once
#      answered to `apex-otel-collector` on apex-collect-net). Join with no alias, or
#      with an apex-infra-* alias only.

name: apex-infra

services:
  # ── ClickHouse: canonical store (contract schema applied on first init from ./sql) ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    container_name: apex-infra-clickhouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEM_LIMIT:-4g}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apex}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (openssl rand -hex 24) - there is no default}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-apex}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"     # HTTP  (human/tool + HyperDX reach-in)
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"   # native TCP (collector + reach-in)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse
      # Contract DDL auto-applied on first boot in filename order: db, contract tables,
      # rollup+MV, skew, otel landing table, plan_transitions, reshape MVs.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-apex}", "--password", "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (openssl rand -hex 24) - there is no default}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      apex:
        # Explicit, collision-proof alias = the globally-unique container name.
        # The short `clickhouse` alias still exists (compose adds it); infra simply
        # never uses it — see the shared-network alias rule at the top of this file.
        aliases: [apex-infra-clickhouse]

  # ── MongoDB: HyperDX application state (dashboards/sources/connections/users) ──
  mongodb:
    # 5.0 line: what HyperDX's own compose ships (mongo:5.0.32-focal as of 2.43). A major
    # upgrade on a live volume is a separate decision, not a pin bump.
    image: mongo:5.0.32-focal@sha256:3b6c281e1c0825d34b28e503b0bc97174132a283eeb79d402bd3893944cf9fd7
    container_name: apex-infra-mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEM_LIMIT:-1g}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # mongosh exits 0 whatever ping printed; grep for a lone `1` is what makes a false
      # ping, a hung server or a connection error fail the check instead of passing it.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      apex:
        aliases: [apex-infra-mongodb]

  # ── HyperDX: UI + API. Seeds a ClickHouse connection + the custom Spark Events Source ──
  # DEFAULT_CONNECTIONS/DEFAULT_SOURCES are applied ONCE on a fresh Mongo, then persist in
  # Mongo. This scripts the #1 HyperDX gotcha: spark_events is a CUSTOM schema HyperDX cannot
  # auto-infer, so every expression (Timestamp=ts, Service=app_id, attributes=attributes,
  # Trace Id=job_id) is set explicitly — otherwise the source silently returns nothing.
  hyperdx:
    # NOTE: the brief's `clickhouse/hdx-oss-v2` is not a real Docker Hub repo. The actual
    # HyperDX v2 app image (the one the official v2 compose uses, supports MONGO_URI +
    # DEFAULT_CONNECTIONS/DEFAULT_SOURCES) is docker.hyperdx.io/hyperdx/hyperdx, mirrored on
    # Docker Hub as hyperdx/hyperdx. Override via HDX_IMAGE / HDX_IMAGE_VERSION in .env.
    # Tag and digest move together: override HDX_IMAGE_VERSION only with HDX_IMAGE_DIGEST.
    image: ${HDX_IMAGE:-hyperdx/hyperdx}:${HDX_IMAGE_VERSION:-2.43.1}@${HDX_IMAGE_DIGEST:-sha256:a9db02b18730846726979a8a948f8439b21988f46a319a9114eae62e136414d9}
    container_name: apex-infra-hyperdx
    deploy:
      resources:
        limits:
          memory: ${HYPERDX_MEM_LIMIT:-2g}
    depends_on:
      clickhouse:
        condition: service_healthy
      mongodb:
        condition: service_healthy   # it stores every dashboard/source/user there; started != answering
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HYPERDX_APP_HOST_PORT:-8090}:${HYPERDX_APP_PORT:-8090}"     # UI  (Port Map: 8090, NOT 8080)
      - "${BIND_HOST:-127.0.0.1}:${HYPERDX_API_HOST_PORT:-8000}:${HYPERDX_API_PORT:-8000}"     # API (browser -> NEXT_PUBLIC_SERVER_URL)
      - "${BIND_HOST:-127.0.0.1}:${HYPERDX_OPAMP_HOST_PORT:-4320}:${HYPERDX_OPAMP_PORT:-4320}" # OpAMP (Port Map: 4320)
    environment:
      FRONTEND_URL: http://localhost:${HYPERDX_APP_PORT:-8090}
      HYPERDX_API_KEY: ${HYPERDX_API_KEY:?set HYPERDX_API_KEY in .env}
      HYPERDX_API_PORT: ${HYPERDX_API_PORT:-8000}
      HYPERDX_APP_PORT: ${HYPERDX_APP_PORT:-8090}
      HYPERDX_APP_URL: http://localhost
      HYPERDX_LOG_LEVEL: ${HYPERDX_LOG_LEVEL:-info}
      MONGO_URI: mongodb://apex-infra-mongodb:27017/hyperdx
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:${HYPERDX_API_PORT:-8000}
      OPAMP_PORT: ${HYPERDX_OPAMP_PORT:-4320}
      OTEL_SERVICE_NAME: hdx-oss-api
      USAGE_STATS_ENABLED: ${USAGE_STATS_ENABLED:-false}
      DEFAULT_CONNECTIONS: '[{"name":"Apex ClickHouse","host":"http://apex-infra-clickhouse:8123","username":"${CLICKHOUSE_USER:-apex}","password":"${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (openssl rand -hex 24) - there is no default}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"apex","tableName":"spark_events"},"kind":"log","name":"Spark Events","timestampValueExpression":"ts","displayedTimestampValueExpression":"ts","implicitColumnExpression":"plan_json","serviceNameExpression":"app_id","bodyExpression":"plan_json","eventAttributesExpression":"attributes","resourceAttributesExpression":"attributes","defaultTableSelectExpression":"ts,app_id,job_id,stage_id,task_duration_p50_ms,task_duration_p99_ms","severityTextExpression":"","traceIdExpression":"job_id","spanIdExpression":"","connection":"Apex ClickHouse"}]'
    restart: unless-stopped
    networks:
      apex:
        aliases: [apex-infra-hyperdx]

  # ── One-shot: a fresh named volume is root-owned, but the contrib collector runs as uid 10001
  # and must write the file_storage queue. Chown once, then the collector starts non-root
  # (same pattern as collect/docker-compose.yml).
  queue-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    container_name: apex-infra-queue-init
    restart: "no"   # one-shot: otel-collector waits for service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 64m
    command: ["sh", "-c", "mkdir -p /var/lib/otelcol/queue && chown -R 10001:10001 /var/lib/otelcol"]
    volumes:
      - otel-queue:/var/lib/otelcol/queue
    networks:
      apex:
        aliases: [apex-infra-queue-init]

  # ── OTel Collector: OTLP ingestion -> apex.otel_traces (contrib; interop-identical to collect) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    container_name: apex-infra-otel-collector
    deploy:
      resources:
        limits:
          memory: ${COLLECTOR_MEM_LIMIT:-2560m}   # memory_limiter caps the pipeline at 2048 MiB (+spike 512)
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apex}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (openssl rand -hex 24) - there is no default}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-queue:/var/lib/otelcol/queue           # crash-safe sending queue (file_storage)
    ports:
      - "${BIND_HOST:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"           # OTLP/HTTP receiver (jar/collect -> infra)
      - "${BIND_HOST:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"           # OTLP/gRPC receiver (optional)
      - "${BIND_HOST:-127.0.0.1}:${COLLECTOR_HEALTH_HOST_PORT:-13133}:13133"  # health_check extension
    depends_on:
      clickhouse:
        condition: service_healthy
      queue-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      apex:
        aliases: [apex-infra-otel-collector]

networks:
  apex:
    name: apex-infra-net

volumes:
  ch-data:
  mongo-data:
  otel-queue:
