spark.eventLog.enabled true
spark.eventLog.dir s3a://spark-logs/events
spark.history.fs.logDirectory s3a://spark-logs/events
spark.history.provider org.apache.spark.deploy.history.FsHistoryProvider
spark.history.fs.update.interval 2s
spark.history.ui.port 18080
spark.eventLog.logStageExecutorMetrics true
spark.ui.showConsoleProgress false
spark.sql.adaptive.enabled true
# shuffle.partitions is intentionally left at the Spark default (AQE coalesces
# it down for small data). A low value like 4 is a shuffle_heavy demo concern
# and is set per-workload in src/workloads/catalog.py, not globally here.
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.endpoint.region us-east-1
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider
