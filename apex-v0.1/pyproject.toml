[project]
name = "apex-v0.1"
version = "0.1.0"
description = "Local Spark 4 platform for lakehouse and execution-observability experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2",
    "pydantic>=2.11.9,<2.13",
    "clickhouse-connect>=0.8",
    "crewai[litellm]>=1.15.1,<2",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "spark: tests that require a local PySpark runtime",
    "llm: tests that make real LLM calls, opt-in via RUN_LLM_TESTS=1",
    "e2e: ground-truth tests that require the running stack, opt-in via APEX_E2E=1 (see `make validate-detectors`)",
]
