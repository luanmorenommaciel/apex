services:
  clickhouse:
    image: spark-plat-v0-clickhouse:26.5.1
    container_name: apex-clickhouse
    environment:
      - CLICKHOUSE_DB=apex
      - CLICKHOUSE_USER=spv0
      - CLICKHOUSE_PASSWORD=spv0
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "28123:8123"
      - "9000:9000"
    volumes:
      - apex_clickhouse_data:/var/lib/clickhouse
      - ./docs/specs/apex_telemetry_v1.sql:/docker-entrypoint-initdb.d/001-apex-telemetry-v1.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "spv0", "--password", "spv0", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: spark-plat-v0-minio:2025-09-07
    container_name: apex-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=spv0
      - MINIO_ROOT_PASSWORD=spv0spv0
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - apex_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: spark-plat-v0-minio-mc:2025-08-13
    container_name: apex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=spv0
      - MINIO_ROOT_PASSWORD=spv0spv0
      - MINIO_LAKEHOUSE_BUCKET=lakehouse
      - MINIO_LOG_BUCKET=spark-logs

  spark-master:
    image: spark-plat-v0-spark:4.1.2
    container_name: apex-spark-master
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=true
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - apex_spark_event_logs:/tmp/spark-events

  spark-worker:
    image: spark-plat-v0-spark:4.1.2
    container_name: apex-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=8
      - SPARK_WORKER_MEMORY=4G
      - SPARK_NO_DAEMONIZE=true
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "8"
      - --memory
      - 4g
      - spark://spark-master:7077
    volumes:
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - apex_spark_event_logs:/tmp/spark-events

volumes:
  apex_clickhouse_data:
  apex_minio_data:
  apex_spark_event_logs:
