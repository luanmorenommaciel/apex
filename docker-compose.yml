services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: apex-clickhouse
    environment:
      - CLICKHOUSE_DB=apex
      - CLICKHOUSE_USER=spv0
      - CLICKHOUSE_PASSWORD=spv0
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "28123:8123"
      - "9000:9000"
    volumes:
      - apex_clickhouse_data:/var/lib/clickhouse
      - ./docs/specs/apex_telemetry_v1.sql:/docker-entrypoint-initdb.d/001-apex-telemetry-v1.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "spv0", "--password", "spv0", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: apex-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=spv0
      - MINIO_ROOT_PASSWORD=spv0spv0
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - apex_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: apex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 spv0 spv0spv0 &&
      mc mb --ignore-existing local/spark-logs &&
      touch /tmp/events.keep &&
      mc cp /tmp/events.keep local/spark-logs/events/.keep
      "

  spark-master:
    image: bitnami/spark:3.5.1
    container_name: apex-spark-master
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=yes
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./docker/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - apex_spark_event_logs:/tmp/spark-events

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: apex-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=8
      - SPARK_WORKER_MEMORY=4G
      - SPARK_NO_DAEMONIZE=yes
    volumes:
      - ./docker/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - apex_spark_event_logs:/tmp/spark-events

volumes:
  apex_clickhouse_data:
  apex_minio_data:
  apex_spark_event_logs:
