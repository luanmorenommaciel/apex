# Apex dev-env base Spark config — Spark 4.x + Delta 4.x + MinIO/S3A.
# Mounted read-only into master, worker, and history. Pathology jobs OVERRIDE
# AQE / broadcast / memory at submit time (never here) so failures aren't auto-healed.

# ── Delta Lake ──────────────────────────────────────────────────────────────
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog

# ── MinIO / S3A ─────────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.endpoint.region         us-east-1
spark.hadoop.fs.s3a.access.key              minioadmin
spark.hadoop.fs.s3a.secret.key              minioadmin
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── Event logging → History Server reads the SAME path ──────────────────────
spark.eventLog.enabled                      true
spark.eventLog.dir                          s3a://spark-logs/events/
spark.history.fs.logDirectory               s3a://spark-logs/events/

# ── Warehouse default ───────────────────────────────────────────────────────
spark.sql.warehouse.dir                     s3a://warehouse/

# ── APEX plugin and test-only fingerprint helper on the classpath ───────────
# ApexPlugin is the sole telemetry path.
spark.driver.extraClassPath                 /opt/apex/lib/apex-devfp.jar:/opt/apex/lib/apex-plugin.jar
spark.executor.extraClassPath               /opt/apex/lib/apex-plugin.jar
spark.plugins                               apex.ApexPlugin
# `apex-otel-collector` is the stable container name on the optional
# apex-collect-net overlay. Outside that overlay export remains best-effort.
spark.apex.otlp.endpoint                    http://apex-otel-collector:4318
spark.apex.aqe.enabled                      true
