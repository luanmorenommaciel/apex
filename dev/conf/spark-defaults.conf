# Apex dev-env base Spark config (T4) — Spark 4.0.x + Delta 4.0.x + MinIO/S3A.
# Mounted read-only into master, worker, and history. Pathology jobs OVERRIDE
# AQE / broadcast / memory at submit time (never here) so failures aren't auto-healed.

# ── Delta Lake ──────────────────────────────────────────────────────────────
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog

# ── MinIO / S3A ─────────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.endpoint.region         us-east-1
spark.hadoop.fs.s3a.access.key              minioadmin
spark.hadoop.fs.s3a.secret.key              minioadmin
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── Event logging → History Server reads the SAME path ──────────────────────
spark.eventLog.enabled                      true
spark.eventLog.dir                          s3a://spark-logs/events/
spark.history.fs.logDirectory               s3a://spark-logs/events/

# ── Warehouse default ───────────────────────────────────────────────────────
spark.sql.warehouse.dir                     s3a://warehouse/

# ── Dev plan-fingerprint helper on the DRIVER classpath (apexdev.PlanFingerprint) ──
spark.driver.extraClassPath                 /opt/apex/lib/apex-devfp.jar
