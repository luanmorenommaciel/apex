[project]
name = "apex-verify"
version = "0.1.0"
description = "Apex verify lane — predicts and replays a proposed fix, and refuses when it cannot. Produces evidence, never authority."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.8,<1"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
