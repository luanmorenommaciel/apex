spark.eventLog.enabled true
spark.eventLog.dir s3a://spark-logs/events
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key spv0
spark.hadoop.fs.s3a.secret.key spv0spv0
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.sql.adaptive.enabled true
spark.jars /opt/apex/listener/apex-spark-listener-0.1.0.jar
spark.extraListeners apex.commander.spark.ApexSparkListener
spark.apex.listener.output /tmp/apex-listener-events.ndjson
spark.apex.listener.failMode false
spark.executor.memory 3g
spark.driver.memory 2g
