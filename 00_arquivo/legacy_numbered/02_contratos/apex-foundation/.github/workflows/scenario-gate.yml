# .github/workflows/scenario-gate.yml
#
# Este e o "porteiro automatico" do merge. A cada Pull Request, o GitHub roda estes
# passos numa maquina limpa. Se qualquer um falhar, o PR fica bloqueado — ninguem
# mergeia codigo quebrado na main. E o "esteira de CI/CD que roda por cada modificacao"
# que o Commander mencionou.

name: scenario-gate

on:
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Testes unitarios (Spark de mentira, sem cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar testes rapidos
        run: make test          # testes que validam a API do Spark sem subir cluster

  scenario-gate:
    name: Gate de cenario (o Watcher TEM que achar o bug plantado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar Spark + deps
        run: pip install pyspark==4.1.2 zstandard
      - name: Rodar os cenarios golden
        # Para cada scenario.yaml: gera o job com o bug, roda no Spark, captura o log,
        # passa pelo Watcher e CONFIRMA que o anti-pattern declarado foi detectado.
        run: make scenario
