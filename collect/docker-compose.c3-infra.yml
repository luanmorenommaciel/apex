# Optional C3 overlay: retain collect's isolated smoke database but route its
# collector into infra's canonical ClickHouse over the Docker network.
services:
  otel-collector:
    environment:
      CLICKHOUSE_ENDPOINT: tcp://apex-infra-clickhouse:9000?compress=lz4&async_insert=1
    networks:
      apex: {}
      apex-infra: {}

networks:
  apex-infra:
    external: true
    name: apex-infra-net
